# Qubix OS — portal backend selection for the Niri session.
#
# Read by: xdg-desktop-portal when XDG_CURRENT_DESKTOP includes "niri". This
# system-administrator profile overrides niri's package profile in /usr/share;
# Plasma reads kde-portals.conf instead and is unaffected. See DD-053.

[preferred]
# Keep GNOME first for interfaces such as ScreenCast that Niri needs it to
# implement, with GTK as the general fallback.
default=gnome;gtk;

# GTK owns ordinary dialogs. GNOME 47+ delegates FileChooser to Nautilus, which
# is not installed in Qubix OS, so selecting GNOME here leaves apps waiting on a
# chooser that never opens.
org.freedesktop.impl.portal.FileChooser=gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;

# Preserve niri's upstream Secret portal selection.
org.freedesktop.impl.portal.Secret=gnome-keyring;

# Read by: distrobox-create (and distrobox assemble), on the HOST, when creating a
#           new container. This is the system-wide default configuration that Distrobox
#           reads from /etc/distrobox/distrobox.conf before the per-user ~/.distroboxrc.
#
# PURPOSE: run the Qubix shell init hook inside every new Distrobox guest, so that
# the guest receives the Qubix zsh experience (Starship, Atuin, zsh-autosuggestions,
# zsh-syntax-highlighting, zsh-completions, and the shared shell helpers) without
# per-container or per-user manual setup.
#
# HOW IT WORKS:
#   container_init_hook is run INSIDE the guest at the end of container initialisation
#   (after the distribution's own setup and any additional-packages install), as the
#   container user, with the user's $HOME available and /run/host pointing at the host
#   root. The hook calls the script at the path it has on the HOST; Distrobox exports
#   the host's PATH and the path /run/host/… is accessible inside the guest.
#
# LIMITS:
#   - init_hooks are per-container-creation only: containers created BEFORE this image
#     was rebased will NOT pick up the hook unless they are recreated. The fix for
#     existing containers is documented in docs/shell.md.
#   - The hook script is stored on the HOST at /usr/share/qubix-os/distrobox/; it
#     reaches the guest via the /run/host bind mount Distrobox sets up automatically.
#   - Users can override this by passing --init-hooks to distrobox create, or by
#     setting container_init_hook in their ~/.distroboxrc (user value wins over this
#     system-wide one in Distrobox's own precedence order).
#
# See docs/shell.md (Distrobox section) and docs/design-decisions.md DD-043.

# ── System-wide init hook ──────────────────────────────────────────────────────
# The script at this host path is called inside every new guest at creation time.
# It installs zsh and the required plugins, then drops in the Qubix zsh integration.
container_init_hook=/run/host/usr/share/qubix-os/distrobox/qubix-distrobox-init.sh

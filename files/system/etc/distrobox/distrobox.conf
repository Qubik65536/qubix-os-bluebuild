# Read by: distrobox on the HOST. Every subcommand — create, enter, assemble, rm — sources
#          the same hierarchy of configuration files, each overriding the one before it:
#
#              /usr/share/distrobox/distrobox.conf
#              /usr/etc/distrobox/distrobox.conf
#              /etc/distrobox/distrobox.conf          <- this file
#              ~/.config/distrobox/distrobox.conf
#              ~/.distroboxrc
#
#          So this overrides anything a package shipped, and a user's own file still
#          overrides this. The Fedora `distrobox` RPM owns no file in /etc/distrobox at all
#          (checked against the package's file list), and ublue-os-just's *.ini assemble
#          manifests, which do live here, are left alone.
#
# WHY IT EXISTS. A distrobox container is a different distribution: its own /etc, its own
# /usr, its own package manager. None of the terminal environment in docs/shell.md is in
# there — the prompt, the history search and the zsh plugins are host packages read from
# host paths, so a shell inside a container came up bare. The hook below is what fixes
# that, once, when the container is created. See docs/shell.md and DD-043.
#
# THE PATH IS A HOST PATH AS SEEN FROM INSIDE THE CONTAINER. distrobox mounts the host's
# root filesystem at /run/host, so /usr/bin/qubix-distrobox-shell in this image is
# /run/host/usr/bin/qubix-distrobox-shell in every container it creates. distrobox-init
# eval's the hook as root, at the end of container setup.
#
# TURNING IT OFF:
#   - for one container:  distrobox create --init-hooks '' …
#     Command-line flags are parsed after these files are sourced, so a flag wins. The same
#     is true of an `init_hooks=` key in a `distrobox assemble` manifest, which replaces
#     this hook rather than adding to it.
#   - for all of them:    comment the line out. /etc is writable and your edit survives a
#     rebase.
container_init_hook="/run/host/usr/bin/qubix-distrobox-shell"

# Read by: starship, as $STARSHIP_CONFIG.
#
# The image's prompt. /etc/profile.d/qubix-shell-env.sh points starship here ONLY when the
# user has no ~/.config/starship.toml of their own, so creating that file overrides all of
# this and nothing has to be undone. This copy is never copied into $HOME: it lives in
# /usr, and a rebase changes the prompt with nothing to re-run (DD-026).
#
# Four rows: context and time, system, toolchain, then the prompt character. The palette
# is oxocarbon; the spine and every bracket are purple, each chip's content carries its
# own accent.
#
# NERD FONT GLYPHS THROUGHOUT. WezTerm — the default terminal (DD-012) — bundles a
# symbols fallback, and cascadia-mono-nf-fonts is installed so fontconfig can resolve them
# for every other consumer. A terminal configured with a font that has neither shows
# boxes; that is a font problem, not a config problem.
#
# See docs/shell.md.

add_newline = false
continuation_prompt = '[▸▹ ](fg:purple)'

# ── oxocarbon · Nerd Font · multi-row chips (│ spine) ─────────────────────────
# Row 1 context + status/time (right) · Row 2 system · Row 3 toolchain · Row 4 prompt.
# Structure/brackets/spine = purple; each chip's content = its accent. No gray text.
format = """
[╭─ ](fg:purple)\
$os\
$username\
$hostname\
$localip\
$shlvl\
$sudo\
$jobs\
$directory\
$git_branch\
$git_state\
$git_status\
$git_commit\
$git_metrics\
$fill\
$status\
$time\
$line_break\
[│  ](fg:purple)\
$cmd_duration\
${custom.load}\
$memory_usage\
${custom.disk}\
$battery\
$container\
$line_break\
[│  ](fg:purple)\
$package\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$lua\
$ruby\
$haskell\
$python\
$conda\
$docker_context\
$kubernetes\
$shell\
$line_break\
[╰─ ](fg:purple)\
$character\
"""

right_format = """
"""


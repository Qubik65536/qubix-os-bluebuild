[username]
show_always = true
style_user = "bold fg:blue"
style_root = "bold fg:magenta"
format = '[\[ ](fg:purple)[ $user]($style)'

[hostname]
format = '[ · ](fg:purple)[ $hostname](italic fg:teal)[ \] ](fg:purple)'
ssh_only = false
disabled = false

[localip]
ssh_only = true
disabled = false
format = '[\[ ](fg:purple)[ $localipv4](fg:cyan)[ \] ](fg:purple)'

[shlvl]
disabled = false
threshold = 2
symbol = ''
repeat = false
style = "fg:purple"
format = '[\[ ](fg:purple)[$symbol $shlvl]($style)[ \] ](fg:purple)'

[sudo]
disabled = false
symbol = ''
style = "fg:magenta"
format = '[\[ ](fg:purple)[$symbol]($style)[ \] ](fg:purple)'

[jobs]
symbol = ''
number_threshold = 1
symbol_threshold = 1
style = "fg:ltblue"
format = '[\[ ](fg:purple)[$symbol $number]($style)[ \] ](fg:purple)'

[directory]
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = ' '
read_only_style = 'fg:magenta'
format = '[\[ ](fg:purple)[ $path](italic fg:sky)[$read_only](fg:magenta)[ \] ](fg:purple)'

[git_branch]
symbol = ""
format = '[\[ ](fg:purple)[ $branch](italic fg:green)[ \] ](fg:purple)'
truncation_symbol = "⋯"
truncation_length = 16

[git_state]
format = '([\[ ](fg:purple)[$state( $progress_current/$progress_total)](bold fg:magenta)[ \] ](fg:purple))'
rebase = "REBASE"
merge = "MERGE"
revert = "REVERT"
cherry_pick = "CHERRY"
bisect = "BISECT"
am = "AM"
am_or_rebase = "AM/REBASE"

[git_status]
format = '([\[ ](fg:purple)[$all_status$ahead_behind](fg:pink)[ \] ](fg:purple))'
conflicted = "◪$count"
ahead = "▴$count"
behind = "▿$count"
diverged = "◇▴${ahead_count}▿${behind_count}"
untracked = "◌$count"
stashed = "◃$count"
modified = "●$count"
staged = "▪$count"
renamed = "◎$count"
deleted = "✕$count"

[git_commit]
format = '[\[ ](fg:purple)[ $hash$tag](fg:purple)[ \] ](fg:purple)'
commit_hash_length = 7
tag_symbol = "   "
tag_disabled = false
disabled = false

[git_metrics]
format = '([\[ ](fg:purple)([+$added ](fg:green))([-$deleted ](fg:magenta))[\] ](fg:purple))'
only_nonzero_diffs = true
disabled = false

[fill]
symbol = ' '
style = 'fg:gray'

[status]
symbol = ''
success_symbol = ''
style = 'fg:magenta'
format = '[\[ ](fg:purple)[ Exit Code $status]($style)[ \] ](fg:purple)'
disabled = false
map_symbol = false

[cmd_duration]
show_milliseconds = false
min_time = 500
format = '[\[ ](fg:purple)[ $duration](italic fg:purple)[ \] ](fg:purple)'
disabled = false
show_notifications = false
min_time_to_notify = 45000

[custom.load]
description = "CPU model + 1-min load average (Linux + macOS)"
shell = ["sh"]
command = '''
# CPU model is static -> detect once and cache; only load is fetched live
cache="${XDG_CACHE_HOME:-$HOME/.cache}/starship_cpu_model"
if [ ! -s "$cache" ]; then
  model=$(sysctl -n machdep.cpu.brand_string 2>/dev/null)
  [ -z "$model" ] && model=$(awk -F: '/model name/{print $2; exit}' /proc/cpuinfo 2>/dev/null)
  [ -z "$model" ] && model=$(lscpu 2>/dev/null | awk -F: '/Model name/{print $2; exit}')
  [ -z "$model" ] && model=$(uname -m)
  model=$(printf '%s' "$model" | sed -e 's/(R)//g; s/(TM)//g; s/(r)//g; s/ CPU.*//; s/ @.*//; s/  */ /g; s/^ *//; s/ *$//')
  mkdir -p "$(dirname "$cache")" && printf '%s' "$model" > "$cache"
fi
model=$(cat "$cache")
load=$(cut -d" " -f1 /proc/loadavg 2>/dev/null); [ -z "$load" ] && load=$(sysctl -n vm.loadavg | awk '{print $2}')
printf '%s · %s' "$model" "$load"
'''
when = "true"
format = '[\[ ](fg:purple)[ $output](fg:cyan)[ \] ](fg:purple)'

[memory_usage]
disabled = false
threshold = 0
symbol = '󰍛'
style = "fg:pink"
format = '[\[ ](fg:purple)[$symbol $ram_pct]($style)[ \] ](fg:purple)'

[custom.disk]
description = "Disk usage % of current filesystem (Linux + macOS)"
shell = ["sh"]
command = "df -Ph . | awk 'NR==2{print $5}'"
when = "true"
format = '[\[ ](fg:purple)[ $output](fg:sky)[ \] ](fg:purple)'

[battery]
full_symbol = ' '
charging_symbol = ' '
discharging_symbol = ' '
unknown_symbol = ' '
empty_symbol = ' '
disabled = false
format = '[\[ ](fg:purple)[$symbol$percentage]($style)[ \] ](fg:purple)'

[[battery.display]]
threshold = 15
style = 'fg:magenta'

[[battery.display]]
threshold = 50
style = 'fg:pink'

[[battery.display]]
threshold = 100
style = 'fg:green'

[container]
disabled = false

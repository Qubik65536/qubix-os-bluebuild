# Read by: the systemd USER manager, as a drop-in for dms.service.
#
# DMS is a Qt/Quickshell Wayland shell, not a KDE application. Keep Plasma's platform
# theme plugin out of its own process even if the user-manager environment imports it.
# DMS's supported default launch prefix restores the setting only for applications opened
# from its launcher; a user's explicit launchPrefix still wins. This must be a DMS drop-in:
# Wants=dms.service starts a sibling unit, not a child of niri.service. DD-066.

[Service]
UnsetEnvironment=QT_QPA_PLATFORMTHEME
Environment="DMS_DEFAULT_LAUNCH_PREFIX=env QT_QPA_PLATFORMTHEME=kde"

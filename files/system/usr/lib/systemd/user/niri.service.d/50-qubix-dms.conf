# Read by: the systemd USER manager, as a drop-in for niri.service (shipped by the niri
# RPM at /usr/lib/systemd/user/niri.service).
#
# Starts DankMaterialShell with the Niri session, and ONLY with the Niri session.
#
# dms.service ships `WantedBy=graphical-session.target`, so simply enabling it would also
# start the shell inside a KDE Plasma session — two panels, two notification daemons, two
# lock screens. It is therefore left disabled, and pulled in from niri.service instead.
#
# This is the image-wide equivalent of DankMaterialShell's documented per-user setup step,
# `systemctl --user add-wants niri.service dms`, which writes the same relationship into
# ~/.config/systemd/user/niri.service.wants/. Doing it as a /usr drop-in means every user
# gets it without running anything, and a user who disagrees can override it in
# ~/.config/systemd/user/niri.service.d/.
#
# See docs/desktops.md and docs/design-decisions.md DD-015.

[Unit]
Wants=dms.service
# Writes the Qubix Slate theme pointer into the user's DMS settings, and is ordered
# Before=dms.service so the shell reads it on first load rather than hot-reloading into
# it. Scoped here for the same reason as dms.service — a Plasma session gets neither.
# See DD-025.
Wants=qubix-dms-theme.service

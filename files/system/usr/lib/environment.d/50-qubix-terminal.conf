# Read by: systemd's user manager (environment.d(5)), for every user session.
#
# Complements the KDE-specific setting in /etc/xdg/kdeglobals: this one covers the
# toolkit-agnostic `$TERMINAL -e <command>` convention that non-KDE tools use, and it
# applies to any session started through the systemd user manager.
#
# `wezterm -e <command>` is valid: `-e` is an alias for the `start` subcommand.
#
# See docs/design-decisions.md DD-012.

TERMINAL=wezterm

# ── Qt/KDE appearance outside Plasma ─────────────────────────────────────────
# A fresh Niri account has no ~/.config/kdeglobals written by a previous Plasma/Aurora
# session. Select KDE's installed Qt platform integration explicitly so Dolphin, System
# Settings, and other KDE applications consume the complete system fallback in /etc/xdg.
# A user can override this in their own session environment. DD-063.
QT_QPA_PLATFORMTHEME=kde

# ── The system config search path ─────────────────────────────────────────────
# WezTerm finds /etc/xdg/wezterm/wezterm.lua only by walking $XDG_CONFIG_DIRS, and it reads
# that variable literally: `if let Some(d) = std::env::var_os("XDG_CONFIG_DIRS")` in
# config/src/lib.rs, with NO fallback to the /etc/xdg the XDG base directory spec calls the
# default. Unset means no system config, so this states the spec default rather than
# hoping a session sets it — Plasma does, niri does not.
#
# APPENDED, NOT DEFAULTED. This was `${XDG_CONFIG_DIRS:-/etc/xdg}`, and `:-` only fills in
# an EMPTY value: a session exporting a list that happens not to contain /etc/xdg kept that
# list, and the config below stayed unreachable with nothing to show for it. `:+` appends
# instead, so /etc/xdg is added whatever the session did, and last — a session that put its
# own directories first keeps its precedence. environment.d(5) supports both forms and its
# own example is this exact shape for LD_LIBRARY_PATH. A duplicate /etc/xdg costs a session
# that already had it nothing: every consumer merges the same file with itself.
#
# THIS FILE CANNOT DO THE JOB ALONE. systemd's user manager applies environment.d to the
# units IT starts, so a shell over SSH, on a text console, or through `su -` never sees any
# of it. /etc/profile.d/qubix-shell-env.sh carries the same append for those. DD-038.
#
# See DD-034 and DD-038.
XDG_CONFIG_DIRS=${XDG_CONFIG_DIRS:+${XDG_CONFIG_DIRS}:}/etc/xdg

# ── Homebrew application metadata ────────────────────────────────────────────
# Linux Homebrew installs shared application metadata below its fixed prefix.
# Graphical launchers read XDG_DATA_DIRS, not a shell's PATH, so DMS and Plasma
# otherwise miss desktop files installed there even though the command works in
# a terminal. Preserve every inherited directory (including Flatpak exports) and
# state the XDG defaults when the variable was previously unset. DD-062.
XDG_DATA_DIRS=/home/linuxbrew/.linuxbrew/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}

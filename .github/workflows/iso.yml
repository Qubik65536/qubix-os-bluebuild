# Qubix OS — manually build installation media from a published image.
#
# This workflow does not build or publish the source OCI image. It turns an existing,
# signed GHCR image into an x86_64 Kinoite installer and keeps the ISO plus checksum only
# as a short-lived Actions artifact. See DD-054 and docs/build-and-release.md.
name: iso

# ── Manual inputs ─────────────────────────────────────────────────────────────
# ISO generation is deliberately opt-in: daily image builds must not create several
# multi-gigabyte artifacts. The Fedora major version is read from the signed image.
on:
  workflow_dispatch:
    inputs:
      image:
        description: Published Qubix image to install
        type: choice
        required: true
        default: standard
        options:
          - standard
          - cachyos
          - nvidia
      image_tag:
        description: Published GHCR tag (for example, latest)
        type: string
        required: true
        default: latest

# ── Concurrency and permissions ───────────────────────────────────────────────
# Re-running the same request replaces an in-progress attempt. Reading the repository is
# the only token permission needed: the source images are public and artifacts require no
# additional permission grant.
concurrency:
  group: iso-${{ inputs.image }}-${{ inputs.image_tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Build and retain the installer ──────────────────────────────────────────
  build-iso:
    name: Build ${{ inputs.image }} ISO
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # Map the friendly choice to its exact published image and reject values that would
      # be unsafe when the upstream composite action passes them into shell commands.
      - name: Resolve installer inputs
        id: prepare
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_VARIANT: ${{ inputs.image }}
        run: |
          set -euo pipefail

          if [[ ! "${IMAGE_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "image_tag is not a valid OCI tag" >&2
            exit 1
          fi
          case "${IMAGE_VARIANT}" in
            standard) image_name="qubix-os-bluebuild" ;;
            cachyos) image_name="qubix-os-bluebuild-cachyos" ;;
            nvidia) image_name="qubix-os-bluebuild-nvidia" ;;
            *) echo "unknown image selection: ${IMAGE_VARIANT}" >&2; exit 1 ;;
          esac

          echo "image_name=${image_name}" >> "${GITHUB_OUTPUT}"

      # The public key is the only repository file needed by this job. Disable persisted
      # credentials because no later step writes to the repository.
      - name: Check out signing key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Authenticate the selected registry tag, capture the signed manifest digest, and
      # give the ISO builder that immutable digest. This closes the tag-change window
      # between verification and the builder's own image copy. Fedora's major version is
      # derived from that same digest, so it cannot drift from the installer repositories.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify and pin source image
        id: verify
        env:
          IMAGE_REF: ghcr.io/qubik65536/${{ steps.prepare.outputs.image_name }}:${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          verification="$(cosign verify --key cosign.pub --output=json "${IMAGE_REF}")"
          digest="$(jq -er '.[0].critical.image["docker-manifest-digest"] | select(test("^sha256:[0-9a-f]{64}$"))' <<< "${verification}")"
          image_repository="${IMAGE_REF%:*}"
          pinned_ref="${image_repository}@${digest}"
          labels="$(docker buildx imagetools inspect --format '{{json .Image.Config.Labels}}' "${pinned_ref}")"
          image_version="$(jq -er '.["org.opencontainers.image.version"]' <<< "${labels}")"
          if [[ ! "${image_version}" =~ (^|[-_])([0-9]{2})\. ]]; then
            echo "cannot derive Fedora major version from OCI version label: ${image_version}" >&2
            exit 1
          fi
          fedora_version="${BASH_REMATCH[2]}"
          artifact_name="qubix-os-${{ inputs.image }}-${{ inputs.image_tag }}-f${fedora_version}-x86_64"

          echo "image_src=docker://${pinned_ref}" >> "${GITHUB_OUTPUT}"
          echo "fedora_version=${fedora_version}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "Verified ${IMAGE_REF} at ${digest}"
          echo "Using Fedora ${fedora_version} from org.opencontainers.image.version=${image_version}"

      # v1.5.0 is pinned by commit so installer machinery cannot change underneath a run.
      # `image_signed` makes future updates enforce the verification policy embedded in
      # Qubix; `image_src` makes the ISO payload itself come from the digest checked above.
      - name: Build ISO
        id: build
        uses: JasonN3/build-container-installer@bed71f841c250650a70f1ed8315ba92da1591ba6 # v1.5.0
        with:
          arch: x86_64
          image_name: ${{ steps.prepare.outputs.image_name }}
          image_repo: ghcr.io/qubik65536
          image_signed: true
          image_src: ${{ steps.verify.outputs.image_src }}
          image_tag: ${{ inputs.image_tag }}
          iso_name: build/${{ steps.verify.outputs.artifact_name }}.iso
          variant: Kinoite
          version: ${{ steps.verify.outputs.fedora_version }}

      # ISOs are already compressed, so recompressing wastes runner time for negligible
      # savings. A seven-day lifetime keeps ad-hoc media available without making Actions
      # storage a release channel. The generated checksum travels with the ISO.
      - name: Upload ISO artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.verify.outputs.artifact_name }}
          path: |
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

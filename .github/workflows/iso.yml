# Qubix OS — build installation media from published images.
#
# This workflow does not build or publish the source OCI image. It turns an existing,
# signed GHCR image into an x86_64 Kinoite installer and sends the ISO plus checksum to a
# Microsoft 365 OneDrive, then publishes a small GitHub Release index. A successful
# default-branch image workflow builds all active variants; manual dispatch can build one
# variant/tag. The media also carries the desktop Flatpaks declared in flatpak_refs/ so
# Anaconda installs them without depending on a first-boot network pass. See DD-054,
# DD-056, DD-058, DD-059, DD-060, DD-061, and docs/build-and-release.md.
name: iso

# ── Triggers and manual inputs ─────────────────────────────────────────────────
on:
  # Build fresh `latest` media only after the image workflow has successfully published
  # every active variant from main. The selector job adds conclusion and event guards.
  workflow_run:
    workflows:
      - bluebuild
    types:
      - completed
    branches:
      - main

  # Retain an ad-hoc path for rebuilding one variant or producing media from an older tag.
  workflow_dispatch:
    inputs:
      image:
        description: Published Qubix image to install
        type: choice
        required: true
        default: standard
        options:
          - standard
          - cachyos
          - nvidia
      image_tag:
        description: Published GHCR tag (for example, latest)
        type: string
        required: true
        default: latest

# ── Concurrency and permissions ───────────────────────────────────────────────
# Serialize whole ISO runs so retention never races another run or accumulates unbounded
# staging uploads. The three variants inside one automatic matrix still run in parallel.
concurrency:
  group: iso-onedrive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Select automatic or manual media ────────────────────────────────────────
  # Automatic runs fan out across every active image at `latest`. Manual runs preserve
  # their one-image/tag request. A failed or irrelevant upstream completion skips here,
  # before any image pull or OneDrive storage is consumed.
  select-images:
    name: Select ISO images
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.select.outputs.images }}
      image_tag: ${{ steps.select.outputs.image_tag }}
      retention_channel: ${{ steps.select.outputs.retention_channel }}
      keep_versions: ${{ steps.select.outputs.keep_versions }}
      source_event: ${{ steps.select.outputs.source_event }}
      source_sha: ${{ steps.select.outputs.source_sha }}
    steps:
      - name: Select images and tag
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_IMAGE: ${{ inputs.image }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            case "${REQUESTED_IMAGE}" in
              standard|cachyos|nvidia) ;;
              *) echo "unknown image selection: ${REQUESTED_IMAGE}" >&2; exit 1 ;;
            esac
            if [[ ! "${REQUESTED_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "image_tag is not a valid OCI tag" >&2
              exit 1
            fi
            images="[\"${REQUESTED_IMAGE}\"]"
            image_tag="${REQUESTED_TAG}"
            # Direct manual ISO runs share the bounded push/ad-hoc retention pool.
            retention_channel="push"
            keep_versions="5"
            source_event="workflow_dispatch"
            source_sha="${GITHUB_SHA}"
          else
            images='["standard","cachyos","nvidia"]'
            image_tag="latest"
            case "${UPSTREAM_EVENT}" in
              schedule)
                retention_channel="scheduled"
                keep_versions="3"
                ;;
              push|workflow_dispatch)
                # A manually dispatched bluebuild also reaches workflow_run.
                retention_channel="push"
                keep_versions="5"
                ;;
              *)
                echo "unsupported upstream event for ISO retention: ${UPSTREAM_EVENT}" >&2
                exit 1
                ;;
            esac
            source_event="${UPSTREAM_EVENT}"
            source_sha="${UPSTREAM_SHA}"
          fi

          if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source commit is not a full Git SHA" >&2
            exit 1
          fi

          echo "images=${images}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "retention_channel=${retention_channel}" >> "${GITHUB_OUTPUT}"
          echo "keep_versions=${keep_versions}" >> "${GITHUB_OUTPUT}"
          echo "source_event=${source_event}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

  # ── Build and retain the installer ──────────────────────────────────────────
  build-iso:
    name: Build ${{ matrix.image }} ISO
    needs: select-images
    runs-on: ubuntu-latest
    permissions:
      # Release/tag publication needs contents write; OIDC remains limited to OneDrive.
      contents: write
      id-token: write
    # A named environment gives Entra one stable OIDC subject for automatic and manual runs.
    # Its variables identify the tenant, app registration, and work/school OneDrive owner.
    environment: onedrive
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.select-images.outputs.images) }}

    steps:
      # Map the friendly choice to its exact published image and reject values that would
      # be unsafe when the upstream composite action passes them into shell commands.
      - name: Resolve installer inputs
        id: prepare
        env:
          IMAGE_TAG: ${{ needs.select-images.outputs.image_tag }}
          IMAGE_VARIANT: ${{ matrix.image }}
        run: |
          set -euo pipefail

          if [[ ! "${IMAGE_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "image_tag is not a valid OCI tag" >&2
            exit 1
          fi
          case "${IMAGE_VARIANT}" in
            standard) image_name="qubix-os-bluebuild" ;;
            cachyos) image_name="qubix-os-bluebuild-cachyos" ;;
            nvidia) image_name="qubix-os-bluebuild-nvidia" ;;
            *) echo "unknown image selection: ${IMAGE_VARIANT}" >&2; exit 1 ;;
          esac

          echo "image_name=${image_name}" >> "${GITHUB_OUTPUT}"

      # The public key is the only repository file needed by this job. Disable persisted
      # credentials because no later step writes to the repository.
      - name: Check out signing key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Turn the readable, commented application manifest into the exact ref syntax the
      # installer action consumes. Keep this derivation fail-closed: malformed refs,
      # duplicates, a missing desktop/browser/store, or Firefox all stop the ISO build.
      - name: Prepare ISO Flatpak references
        env:
          EXPECTED_REF_COUNT: "26"
        run: |
          set -euo pipefail

          manifest="flatpak_refs/iso-refs.txt"
          output_dir="build/flatpak-refs"
          output_file="${output_dir}/apps"
          mkdir -p "${output_dir}"

          LC_ALL=C awk '
            /^[[:space:]]*(#|$)/ { next }
            !/^(app|runtime)\/[A-Za-z0-9][A-Za-z0-9._-]+\/x86_64\/[A-Za-z0-9][A-Za-z0-9._-]+$/ {
              printf "invalid Flatpak ref at line %d: %s\n", NR, $0 > "/dev/stderr"
              invalid = 1
              next
            }
            { print }
            END { exit invalid }
          ' "${manifest}" > "${output_file}"

          ref_count="$(wc -l < "${output_file}" | tr -d '[:space:]')"
          if [[ "${ref_count}" != "${EXPECTED_REF_COUNT}" ]]; then
            echo "expected ${EXPECTED_REF_COUNT} ISO Flatpak refs, found ${ref_count}" >&2
            exit 1
          fi
          if duplicate="$(LC_ALL=C sort "${output_file}" | uniq -d)" && [[ -n "${duplicate}" ]]; then
            echo "duplicate ISO Flatpak ref: ${duplicate}" >&2
            exit 1
          fi
          if grep -qF '/org.mozilla.firefox/' "${output_file}"; then
            echo "Firefox must remain absent from Qubix installer media" >&2
            exit 1
          fi
          for required in \
            app/io.github.kolunmi.Bazaar/x86_64/stable \
            app/io.github.ungoogled_software.ungoogled_chromium/x86_64/stable \
            app/org.gnome.Loupe/x86_64/stable \
            runtime/org.gtk.Gtk3theme.Breeze/x86_64/3.22; do
            grep -qxF "${required}" "${output_file}"
          done

          echo "Prepared ${ref_count} Flatpak refs for the installer"

      # Authenticate the selected registry tag, capture the signed manifest digest, and
      # give the ISO builder that immutable digest. This closes the tag-change window
      # between verification and the builder's own image copy. Fedora's major version is
      # derived from that same digest, so it cannot drift from the installer repositories.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify and pin source image
        id: verify
        env:
          IMAGE_REF: ghcr.io/qubik65536/${{ steps.prepare.outputs.image_name }}:${{ needs.select-images.outputs.image_tag }}
          IMAGE_TAG: ${{ needs.select-images.outputs.image_tag }}
          IMAGE_VARIANT: ${{ matrix.image }}
        run: |
          set -euo pipefail

          verification="$(cosign verify --key cosign.pub --output=json "${IMAGE_REF}")"
          digest="$(jq -er '.[0].critical.image["docker-manifest-digest"] | select(test("^sha256:[0-9a-f]{64}$"))' <<< "${verification}")"
          image_repository="${IMAGE_REF%:*}"
          pinned_ref="${image_repository}@${digest}"
          labels="$(docker buildx imagetools inspect --format '{{json .Image.Config.Labels}}' "${pinned_ref}")"
          image_version="$(jq -er '.["org.opencontainers.image.version"]' <<< "${labels}")"
          if [[ ! "${image_version}" =~ (^|[-_])([0-9]{2})\. ]]; then
            echo "cannot derive Fedora major version from OCI version label: ${image_version}" >&2
            exit 1
          fi
          fedora_version="${BASH_REMATCH[2]}"
          iso_basename="qubix-os-${IMAGE_VARIANT}-${IMAGE_TAG}-f${fedora_version}-x86_64"
          digest_short="${digest#sha256:}"
          onedrive_version="${IMAGE_TAG}-f${fedora_version}-${digest_short:0:12}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "image_src=docker://${pinned_ref}" >> "${GITHUB_OUTPUT}"
          echo "image_digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "fedora_version=${fedora_version}" >> "${GITHUB_OUTPUT}"
          echo "iso_basename=${iso_basename}" >> "${GITHUB_OUTPUT}"
          echo "onedrive_version=${onedrive_version}" >> "${GITHUB_OUTPUT}"
          echo "Verified ${IMAGE_REF} at ${digest}"
          echo "Using Fedora ${fedora_version} from org.opencontainers.image.version=${image_version}"

      # The pinned installer action asks Ubuntu 24.04 for umoci, which currently yields
      # v0.4.7. That release predates zstd OCI layers and cannot unpack current BlueBuild
      # images while discovering Flatpak runtime dependencies. The unpack runs under sudo,
      # so GITHUB_PATH cannot override sudo's secure path. Install the checksum-pinned
      # v0.6.0 binary in /usr/local/bin, ahead of /usr/bin for both lookups. Disabling
      # dependency discovery would omit runtime refs.
      - name: Install zstd-capable umoci
        env:
          UMOCI_AMD64_SHA256: b51c267ec394499e42c6fde47f240b7b7dba57ea49df0b5acd304378b82a3b71
          UMOCI_VERSION: v0.6.0
        run: |
          set -euo pipefail

          download_dir="${RUNNER_TEMP}/qubix-iso-tools"
          download_path="${download_dir}/umoci"
          mkdir -p "${download_dir}"

          curl --fail --location --retry 3 --show-error --silent \
            "https://github.com/opencontainers/umoci/releases/download/${UMOCI_VERSION}/umoci.linux.amd64" \
            --output "${download_path}"
          printf '%s  %s\n' "${UMOCI_AMD64_SHA256}" "${download_path}" | sha256sum --check
          sudo install --mode=0755 "${download_path}" /usr/local/bin/umoci
          /usr/local/bin/umoci --version

      - name: Verify umoci override
        run: |
          set -euo pipefail

          expected_umoci="/usr/local/bin/umoci"
          user_umoci="$(command -v umoci)"
          privileged_umoci="$(sudo sh -c 'command -v umoci')"
          if [[ "${user_umoci}" != "${expected_umoci}" ]]; then
            echo "expected ${expected_umoci} on user PATH, found ${user_umoci}" >&2
            exit 1
          fi
          if [[ "${privileged_umoci}" != "${expected_umoci}" ]]; then
            echo "expected ${expected_umoci} on sudo PATH, found ${privileged_umoci}" >&2
            exit 1
          fi
          umoci --version | grep -qF 'umoci version 0.6.0'
          sudo sh -c 'umoci --version' | grep -qF 'umoci version 0.6.0'

      # v1.5.0 is pinned by commit so installer machinery cannot change underneath a run.
      # `image_signed` makes future updates enforce the verification policy embedded in
      # Qubix; `image_src` makes the ISO payload itself come from the digest checked above.
      # The generated ref directory makes the action resolve runtimes and build an offline
      # Flathub repository that Anaconda transfers into the installed system. DD-061.
      - name: Build ISO
        id: build
        uses: JasonN3/build-container-installer@bed71f841c250650a70f1ed8315ba92da1591ba6 # v1.5.0
        with:
          arch: x86_64
          enable_flatpak_dependencies: "true"
          image_name: ${{ steps.prepare.outputs.image_name }}
          image_repo: ghcr.io/qubik65536
          image_signed: true
          image_src: ${{ steps.verify.outputs.image_src }}
          image_tag: ${{ needs.select-images.outputs.image_tag }}
          flatpak_remote_name: flathub
          flatpak_remote_refs_dir: build/flatpak-refs
          flatpak_remote_url: https://dl.flathub.org/repo/flathub.flatpakrepo
          iso_name: build/${{ steps.verify.outputs.iso_basename }}.iso
          variant: Kinoite
          version: ${{ steps.verify.outputs.fedora_version }}

      # Upload directly from the builder because the ISO exceeds the useful Actions-artifact
      # path. The local action publishes the pair atomically and permanently purges complete
      # versions beyond this trigger channel's limit within this variant.
      - name: Upload ISO to Microsoft 365 OneDrive
        id: onedrive
        uses: ./.github/actions/upload-onedrive
        with:
          tenant-id: ${{ vars.ONEDRIVE_TENANT_ID }}
          client-id: ${{ vars.ONEDRIVE_CLIENT_ID }}
          user-id: ${{ vars.ONEDRIVE_USER_ID }}
          variant: ${{ matrix.image }}
          retention-channel: ${{ needs.select-images.outputs.retention_channel }}
          version: ${{ steps.verify.outputs.onedrive_version }}
          iso-path: ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
          checksum-path: ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM
          keep-versions: ${{ needs.select-images.outputs.keep_versions }}

      # Publish only metadata and durable OneDrive links. Scheduled builds are normal
      # releases; push and both manual routes are prereleases. Matching dead links and
      # generated releases older than three months are cleaned up best-effort.
      - name: Publish ISO GitHub Release
        uses: ./.github/actions/publish-iso-release
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          variant: ${{ matrix.image }}
          retention-channel: ${{ needs.select-images.outputs.retention_channel }}
          source-event: ${{ needs.select-images.outputs.source_event }}
          source-sha: ${{ needs.select-images.outputs.source_sha }}
          image-name: ${{ steps.prepare.outputs.image_name }}
          image-tag: ${{ needs.select-images.outputs.image_tag }}
          image-digest: ${{ steps.verify.outputs.image_digest }}
          fedora-version: ${{ steps.verify.outputs.fedora_version }}
          version: ${{ steps.verify.outputs.onedrive_version }}
          iso-name: ${{ steps.verify.outputs.iso_basename }}.iso
          iso-url: ${{ steps.onedrive.outputs.iso-url }}
          checksum-name: ${{ steps.verify.outputs.iso_basename }}.iso-CHECKSUM
          checksum-url: ${{ steps.onedrive.outputs.checksum-url }}
          iso-sha256: ${{ steps.onedrive.outputs.iso-sha256 }}
          iso-size-bytes: ${{ steps.onedrive.outputs.iso-size-bytes }}
          purged-versions: ${{ steps.onedrive.outputs.purged-versions }}
          keep-versions: ${{ needs.select-images.outputs.keep_versions }}

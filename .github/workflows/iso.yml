# Qubix OS — build installation media from published images.
#
# This workflow does not build or publish the source OCI image. It turns an existing,
# signed GHCR image into an x86_64 Kinoite installer and sends the ISO plus checksum to a
# Microsoft 365 OneDrive. A successful default-branch image workflow builds all active
# variants; manual dispatch can build one variant/tag. See DD-054, DD-056, DD-058, DD-059,
# and docs/build-and-release.md.
name: iso

# ── Triggers and manual inputs ─────────────────────────────────────────────────
on:
  # Build fresh `latest` media only after the image workflow has successfully published
  # every active variant from main. The selector job adds conclusion and event guards.
  workflow_run:
    workflows:
      - bluebuild
    types:
      - completed
    branches:
      - main

  # Retain an ad-hoc path for rebuilding one variant or producing media from an older tag.
  workflow_dispatch:
    inputs:
      image:
        description: Published Qubix image to install
        type: choice
        required: true
        default: standard
        options:
          - standard
          - cachyos
          - nvidia
      image_tag:
        description: Published GHCR tag (for example, latest)
        type: string
        required: true
        default: latest

# ── Concurrency and permissions ───────────────────────────────────────────────
# Serialize whole ISO runs so retention never races another run or accumulates unbounded
# staging uploads. The three variants inside one automatic matrix still run in parallel.
concurrency:
  group: iso-onedrive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Select automatic or manual media ────────────────────────────────────────
  # Automatic runs fan out across every active image at `latest`. Manual runs preserve
  # their one-image/tag request. A failed or irrelevant upstream completion skips here,
  # before any image pull or OneDrive storage is consumed.
  select-images:
    name: Select ISO images
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.select.outputs.images }}
      image_tag: ${{ steps.select.outputs.image_tag }}
      retention_channel: ${{ steps.select.outputs.retention_channel }}
      keep_versions: ${{ steps.select.outputs.keep_versions }}
    steps:
      - name: Select images and tag
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_IMAGE: ${{ inputs.image }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            case "${REQUESTED_IMAGE}" in
              standard|cachyos|nvidia) ;;
              *) echo "unknown image selection: ${REQUESTED_IMAGE}" >&2; exit 1 ;;
            esac
            if [[ ! "${REQUESTED_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "image_tag is not a valid OCI tag" >&2
              exit 1
            fi
            images="[\"${REQUESTED_IMAGE}\"]"
            image_tag="${REQUESTED_TAG}"
            # Direct manual ISO runs share the bounded push/ad-hoc retention pool.
            retention_channel="push"
            keep_versions="5"
          else
            images='["standard","cachyos","nvidia"]'
            image_tag="latest"
            case "${UPSTREAM_EVENT}" in
              schedule)
                retention_channel="scheduled"
                keep_versions="3"
                ;;
              push|workflow_dispatch)
                # A manually dispatched bluebuild also reaches workflow_run.
                retention_channel="push"
                keep_versions="5"
                ;;
              *)
                echo "unsupported upstream event for ISO retention: ${UPSTREAM_EVENT}" >&2
                exit 1
                ;;
            esac
          fi

          echo "images=${images}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "retention_channel=${retention_channel}" >> "${GITHUB_OUTPUT}"
          echo "keep_versions=${keep_versions}" >> "${GITHUB_OUTPUT}"

  # ── Build and retain the installer ──────────────────────────────────────────
  build-iso:
    name: Build ${{ matrix.image }} ISO
    needs: select-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # A named environment gives Entra one stable OIDC subject for automatic and manual runs.
    # Its variables identify the tenant, app registration, and work/school OneDrive owner.
    environment: onedrive
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.select-images.outputs.images) }}

    steps:
      # Map the friendly choice to its exact published image and reject values that would
      # be unsafe when the upstream composite action passes them into shell commands.
      - name: Resolve installer inputs
        id: prepare
        env:
          IMAGE_TAG: ${{ needs.select-images.outputs.image_tag }}
          IMAGE_VARIANT: ${{ matrix.image }}
        run: |
          set -euo pipefail

          if [[ ! "${IMAGE_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "image_tag is not a valid OCI tag" >&2
            exit 1
          fi
          case "${IMAGE_VARIANT}" in
            standard) image_name="qubix-os-bluebuild" ;;
            cachyos) image_name="qubix-os-bluebuild-cachyos" ;;
            nvidia) image_name="qubix-os-bluebuild-nvidia" ;;
            *) echo "unknown image selection: ${IMAGE_VARIANT}" >&2; exit 1 ;;
          esac

          echo "image_name=${image_name}" >> "${GITHUB_OUTPUT}"

      # The public key is the only repository file needed by this job. Disable persisted
      # credentials because no later step writes to the repository.
      - name: Check out signing key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Authenticate the selected registry tag, capture the signed manifest digest, and
      # give the ISO builder that immutable digest. This closes the tag-change window
      # between verification and the builder's own image copy. Fedora's major version is
      # derived from that same digest, so it cannot drift from the installer repositories.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify and pin source image
        id: verify
        env:
          IMAGE_REF: ghcr.io/qubik65536/${{ steps.prepare.outputs.image_name }}:${{ needs.select-images.outputs.image_tag }}
          IMAGE_TAG: ${{ needs.select-images.outputs.image_tag }}
          IMAGE_VARIANT: ${{ matrix.image }}
        run: |
          set -euo pipefail

          verification="$(cosign verify --key cosign.pub --output=json "${IMAGE_REF}")"
          digest="$(jq -er '.[0].critical.image["docker-manifest-digest"] | select(test("^sha256:[0-9a-f]{64}$"))' <<< "${verification}")"
          image_repository="${IMAGE_REF%:*}"
          pinned_ref="${image_repository}@${digest}"
          labels="$(docker buildx imagetools inspect --format '{{json .Image.Config.Labels}}' "${pinned_ref}")"
          image_version="$(jq -er '.["org.opencontainers.image.version"]' <<< "${labels}")"
          if [[ ! "${image_version}" =~ (^|[-_])([0-9]{2})\. ]]; then
            echo "cannot derive Fedora major version from OCI version label: ${image_version}" >&2
            exit 1
          fi
          fedora_version="${BASH_REMATCH[2]}"
          iso_basename="qubix-os-${IMAGE_VARIANT}-${IMAGE_TAG}-f${fedora_version}-x86_64"
          digest_short="${digest#sha256:}"
          onedrive_version="${IMAGE_TAG}-f${fedora_version}-${digest_short:0:12}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "image_src=docker://${pinned_ref}" >> "${GITHUB_OUTPUT}"
          echo "fedora_version=${fedora_version}" >> "${GITHUB_OUTPUT}"
          echo "iso_basename=${iso_basename}" >> "${GITHUB_OUTPUT}"
          echo "onedrive_version=${onedrive_version}" >> "${GITHUB_OUTPUT}"
          echo "Verified ${IMAGE_REF} at ${digest}"
          echo "Using Fedora ${fedora_version} from org.opencontainers.image.version=${image_version}"

      # v1.5.0 is pinned by commit so installer machinery cannot change underneath a run.
      # `image_signed` makes future updates enforce the verification policy embedded in
      # Qubix; `image_src` makes the ISO payload itself come from the digest checked above.
      - name: Build ISO
        id: build
        uses: JasonN3/build-container-installer@bed71f841c250650a70f1ed8315ba92da1591ba6 # v1.5.0
        with:
          arch: x86_64
          image_name: ${{ steps.prepare.outputs.image_name }}
          image_repo: ghcr.io/qubik65536
          image_signed: true
          image_src: ${{ steps.verify.outputs.image_src }}
          image_tag: ${{ needs.select-images.outputs.image_tag }}
          iso_name: build/${{ steps.verify.outputs.iso_basename }}.iso
          variant: Kinoite
          version: ${{ steps.verify.outputs.fedora_version }}

      # Upload directly from the builder because the ISO exceeds the useful Actions-artifact
      # path. The local action publishes the pair atomically and permanently purges complete
      # versions beyond this trigger channel's limit within this variant.
      - name: Upload ISO to Microsoft 365 OneDrive
        uses: ./.github/actions/upload-onedrive
        with:
          tenant-id: ${{ vars.ONEDRIVE_TENANT_ID }}
          client-id: ${{ vars.ONEDRIVE_CLIENT_ID }}
          user-id: ${{ vars.ONEDRIVE_USER_ID }}
          variant: ${{ matrix.image }}
          retention-channel: ${{ needs.select-images.outputs.retention_channel }}
          version: ${{ steps.verify.outputs.onedrive_version }}
          iso-path: ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
          checksum-path: ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM
          keep-versions: ${{ needs.select-images.outputs.keep_versions }}

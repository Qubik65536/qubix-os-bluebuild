# Qubix OS — image build, sign, and publish.
#
# This is the ONLY place the images are ever built; there is no local build.
# The whole job is delegated to the BlueBuild action, which renders a recipe from
# recipes/ into a Containerfile, builds it, signs it with cosign, and pushes it to GHCR.
#
# ONE JOB PER ACTIVE RECIPE. The parked NVIDIA+CachyOS recipe remains in recipes/ but is
# intentionally absent here (DD-052). Shared recipes/common-*.yml files are included by
# active recipes and are never built directly (DD-016). Adding or re-enabling a variant
# means adding it in TWO places in this file: the
# `workflow_dispatch` options and the `select-recipes` job below.
#
# Docs: docs/build-and-release.md  (triggers, signing, tags, failure triage)
#       docs/variants.md           (what the variants are)
#       docs/design-decisions.md   (why — referenced below as DD-###)
name: bluebuild

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  # Weekly rebuild limits unattended CI use while still refreshing the image. DD-055.
  # This also picks up new CachyOS kernels and NVIDIA base images for the active variants
  # that consume them (DD-017, DD-051, DD-052).
  schedule:
    - cron:
        "00 00 * * 0" # build every Sunday at 00:00 UTC

  # Every push, except commits that touch ONLY Markdown. DD-010.
  # Caveat: a commit touching a .md file AND a recipe still builds — paths-ignore
  # skips a push only when every changed path matches.
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  # PRs always build (paths-ignore does not apply here) — this validates the recipes
  # before merge, which is worth the CI minutes.
  pull_request:

  # Manual runs can target a single variant. Useful when one image needs a rebuild —
  # an upstream fix, a COPR that was briefly broken — and rebuilding all three is waste.
  workflow_dispatch:
    inputs:
      recipe:
        description: Which image(s) to build
        type: choice
        required: false
        default: all
        options:
          - all
          - recipe.yml
          - recipe-cachyos.yml
          - recipe-nvidia.yml

# ── Concurrency ───────────────────────────────────────────────────────────────
# One run per ref; a newer push cancels the running one, so rapid pushes cost a
# single run rather than a queue of superseded ones. The whole matrix is cancelled
# together — variants are never partially superseded.
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # ── Which recipes does this run build? ──────────────────────────────────────
  # Emits a JSON array consumed as the build matrix. Every trigger except a manual
  # run builds everything; a manual run honours the `recipe` input.
  # `inputs.recipe` is empty for non-dispatch events, hence the `|| 'all'`.
  select-recipes:
    name: Select recipes
    runs-on: ubuntu-latest
    outputs:
      recipes: ${{ steps.select.outputs.recipes }}
    steps:
      - name: Select recipes
        id: select
        env:
          SELECTION: ${{ inputs.recipe || 'all' }}
        run: |
          set -euo pipefail
          if [ "${SELECTION}" = "all" ]; then
            # Keep this list identical to the active workflow_dispatch recipes above.
            # recipe-nvidia-cachyos.yml is deliberately parked by DD-052.
            RECIPES='["recipe.yml","recipe-cachyos.yml","recipe-nvidia.yml"]'
          else
            RECIPES="[\"${SELECTION}\"]"
          fi
          echo "Building: ${RECIPES}"
          echo "recipes=${RECIPES}" >> "${GITHUB_OUTPUT}"

  # ── Build, sign, push ───────────────────────────────────────────────────────
  bluebuild:
    name: Build ${{ matrix.recipe }}
    needs: select-recipes
    runs-on: ubuntu-latest
    # A full image build is ~30–45 minutes. This bound only catches a hung run, so it
    # frees the runner in an hour and a half instead of GitHub's six-hour default.
    timeout-minutes: 90

    # Least privilege: read the repo, push to GHCR, and mint an OIDC token for
    # Sigstore signing. Nothing here needs more than this.
    permissions:
      contents: read # check out the repository
      packages: write # push the image to GHCR
      id-token: write # OIDC token for cosign/Sigstore

    # One job per recipe, from the job above. fail-fast is off so one broken variant
    # doesn't cancel the others — a kernel COPR or NVIDIA build failure must not stop
    # the unaffected images from shipping.
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe: ${{ fromJSON(needs.select-recipes.outputs.recipes) }}

    steps:
      # Check out the exact revision that GitHub assigned to this run. The build action
      # normally performs its own checkout, but we need the workspace first to stamp the
      # source revision into the image overlay.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Give the image identity module a trustworthy, build-specific source revision.
      # The generated file is consumed by recipes/common-identity.yml and is not tracked
      # in the repository; each matrix job writes the SHA for its own checkout.
      - name: Stamp source revision
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub source revision is not a full Git SHA" >&2
            exit 1
          fi
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [[ "${CHECKED_OUT_SHA}" != "${SOURCE_SHA}" ]]; then
            echo "Checked-out revision does not match GitHub source revision" >&2
            exit 1
          fi
          mkdir -p files/system/usr/lib/qubix-os
          printf '%s\n' "${SOURCE_SHA}" > files/system/usr/lib/qubix-os/source-revision

      # The build, tag, sign, and push are all handled by the reusable action. Checkout is
      # disabled because the workspace was checked out and stamped in the preceding steps.
      # The cosign private key lives only in the SIGNING_SECRET repository secret —
      # never in git (.gitignore blocks cosign.key / cosign.private). All variants are
      # signed with the same key. DD-008.
      - name: Build Custom Image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }} # tags PR builds separately from `latest`
          skip_checkout: true

          # Reclaims runner disk before building; these images are large.
          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true

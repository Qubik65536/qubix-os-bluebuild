---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
#
# Qubix OS — modules shared by EVERY variant.
#
# Included with `from-file: common-base.yml` from each recipe in recipes/. Everything that
# makes an image "Qubix OS" rather than "Aurora DX" lives here; a variant recipe adds to
# this, it does not fork it. DD-016.
#
# Modules still execute TOP TO BOTTOM, in the position the including recipe puts this file.
#
# Docs:  docs/recipe-reference.md   (what every module does)
#        docs/variants.md           (what the variants are)
#        docs/design-decisions.md   (why — referenced below as DD-###)

modules:
  # 1. Overlay the image root.
  #    Copies files/system/* into / — repository path IS the image path, byte for byte.
  #    Carries branding assets (asset → consumer map in docs/branding.md) and
  #    system-wide desktop configuration (docs/desktops.md).
  #    No templating here: anything needing a build-time value must use `containerfile`.
  #    Ordering: no hard constraint; kept first so content lands before anything reads it.
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  # 2. Package changes (layered RPMs).
  #    Ordering: MUST precede default-flatpaks, so the Firefox RPM is gone before the
  #    browser Flatpak replacing it is queued (DD-006, DD-023).
  #    NOT the place for kernels: a variant that swaps the kernel does it in its own
  #    module file, after this one (DD-017).
  - type: dnf
    repos:
      copr:
        # starship is not in Fedora's main repos; this is the maintainer-run COPR. DD-007.
        - atim/starship
        # WezTerm is not packaged in Fedora at all. This is WezTerm's OWN COPR, run by
        # its author — the only Fedora-native source. DD-012.
        - wezfurlong/wezterm-nightly
        # DankMaterialShell, the desktop shell for the Niri session. DD-015.
        # BOTH of these are required: `dms` holds the shell itself, and its runtime
        # dependencies (quickshell, dgop, matugen, the icon font) live in the companion
        # `danklinux` repo. Enabling only the first leaves `dms` uninstallable.
        - avengemedia/dms
        - avengemedia/danklinux
        # yazi is not packaged by Fedora. This COPR builds it for the current and next
        # Fedora, and is the one yazi's own installation docs point Fedora users at. DD-026.
        - lihaohong/yazi
        # lazygit is not packaged by Fedora either. Same maintainer as atim/starship above,
        # so this adds a package rather than a party to trust. DD-026.
        - atim/lazygit
    install:
      packages:
        - micro # lightweight terminal editor
        - starship # cross-shell prompt (from the COPR above)
        # Default terminal for BOTH desktop sessions. Metapackage: pulls wezterm-common
        # (the `wezterm` binary), wezterm-gui, and wezterm-mux-server. It is additive —
        # Konsole and every other KDE component stays installed. DD-012.
        #
        # Its CONFIGURATION is in the overlay, files/system/etc/xdg/wezterm/ — the only
        # system-wide location WezTerm reads, reached through $XDG_CONFIG_DIRS. DD-034.
        - wezterm
        # The half of WezTerm's font stack Fedora does package. Monaspace Krypton NF (the
        # primary face) and IBM Plex Math are not packaged by anyone and are installed from
        # upstream in module 4d below.
        - ibm-plex-mono-fonts
        - ibm-plex-sans-fonts
        # Converts the Monaspace Krypton NF faces from module 4d into the PF2 bitmap fonts
        # GRUB can load. GRUB cannot read OTF directly. DD-057.
        - grub2-tools-extra
        # CJK coverage, in place of IBM Plex Sans SC/TC/JP: those exist only as ~1.2 GB of
        # GitHub release archives, and Fedora's ibm-plex-fonts carries no CJK subpackage at
        # all. The STATIC package, not google-noto-sans-cjk-vf-fonts, because the .ttc files
        # expose "Noto Sans CJK SC" / "TC" / "JP" as plain family names — which is what the
        # config asks for by name. Both may be installed; this one is additive. DD-034.
        - google-noto-sans-cjk-fonts
        # Needed by module 4d, which unpacks two upstream font archives. Not assumed to be
        # on Aurora DX already, for the same reason `git` is listed further down.
        - unzip
        # Second desktop session, ALONGSIDE KDE Plasma — nothing Plasma is removed.
        # In Fedora's main repos. Ships /usr/share/wayland-sessions/niri.desktop, which
        # is all SDDM needs to offer it as a login choice. Weak deps bring the pieces a
        # bare compositor does not have (waybar, fuzzel, swaylock, the GTK/GNOME
        # portals); xwayland-satellite is a hard dependency and needs no setup. DD-013.
        - niri
        # Desktop shell for the Niri session: panel, launcher, notifications, lock
        # screen, power menu. Started by systemd only under Niri, never under Plasma —
        # see files/system/usr/lib/systemd/user/niri.service.d/. DD-015.
        - dms
        # Fonts DankMaterialShell renders with. Not hard dependencies of the RPM, so
        # they are named here: without material-symbols-fonts every icon in the shell
        # is a missing-glyph box.
        - material-symbols-fonts
        - fira-code-fonts
        - rsms-inter-fonts
        # Clipboard history backend behind the shell's clipboard panel (Mod+V).
        - cliphist
        # ── Simplified Chinese input ─────────────────────────────────────────
        # Fedora packages the complete Fcitx 5 stack that Rocky Linux 10 lacks,
        # including the Pinyin engine and Plasma KCM, so no locally compiled input
        # method code is needed. The two toolkit packages pull the matching GTK 2/3/4
        # and Qt 5/6 modules conditionally for toolkits present in Aurora. DD-050.
        #
        # Defaults live in /etc/xdg/fcitx5/{profile,config}, /etc/xdg/kwinrc, Niri's
        # environment block, the GTK settings, and the late profile.d environment
        # correction from module 1. Fcitx itself handles both desktop trigger keys.
        # fcitx5-autostart supplies XDG autostart (needed by Niri) and Fedora's input-
        # method environment. The overlay narrows its GTK variable on Wayland so native
        # clients use the compositor protocol; KWin starts Fcitx as its special client.
        - fcitx5
        - fcitx5-autostart
        - fcitx5-chinese-addons
        - fcitx5-gtk
        - fcitx5-qt
        - kcm-fcitx5
        # ── Terminal environment ──────────────────────────────────────────────
        # The shell, its editor, and the tools they call. Configuration for all of it is
        # in the overlay — files/system/etc/profile.d/ and usr/share/qubix-os/shell/,
        # plus the block module 4f appends to /etc/zshrc — so installing these packages
        # is only half the job. DD-026, DD-030, DD-036.
        #
        # zsh is the login shell, and nothing in this file can make it so: that lives in
        # /etc/passwd, per account, and an image cannot write another machine's
        # /etc/passwd. files/system/etc/default/useradd covers accounts created from now
        # on, and qubix-default-shell.service (module 5) covers the ones that already
        # exist, once each. Bash stays fully configured regardless — moving back is
        # `sudo usermod -s /bin/bash $USER`, and the service never reverses it. DD-035.
        - zsh
        - zsh-autosuggestions # the greyed-out suggestion from history
        - zsh-syntax-highlighting # command colouring as you type
        # Shell history in a local SQLite database, searchable from every terminal.
        # Wired into zsh only — its bash integration needs bash-preexec, which Fedora does
        # not package. See files/system/usr/share/qubix-os/shell/qubix.bash.
        - atuin
        - bat # cat with syntax highlighting; aliased over `cat` interactively
        - yazi # terminal file browser (from the COPR above)
        # System information, on demand. In Fedora's main repos. Nothing runs it for
        # the user — the point of installing it is the config in the overlay,
        # files/system/etc/fastfetch/config.jsonc, which is the only system-wide path
        # fastfetch reads (its search path has no /usr entry). A user's own
        # ~/.config/fastfetch/config.jsonc still replaces it wholesale. DD-031.
        - fastfetch
        # The editor. Its CONFIG is deliberately not shipped: ~/.config/nvim is the
        # user's, from a documented `git clone` of LazyVim's starter, which is also what
        # makes `git pull` update it later. DD-030.
        - neovim
        # What LazyVim's default keymaps shell out to, present so that the config the
        # user clones works on the first run. Without these the keys exist and do nothing:
        # ripgrep and fd-find back the pickers, fzf backs fuzzy selection, and git is how
        # lazy.nvim installs every plugin on first launch.
        - ripgrep
        - fd-find
        - fzf
        - git
        # Terminal UI for git, in its own right — not only LazyVim's <leader>gg, which
        # also runs this binary. From the COPR above. Its config is in the overlay,
        # /usr/share/qubix-os/lazygit/config.yml, reached through LG_CONFIG_FILE in
        # /etc/profile.d/qubix-shell-env.sh; `lg` (in shell/common.sh) is upstream's
        # wrapper that lets the shell follow lazygit between repositories. DD-032.
        - lazygit
        # A Nerd Font, for the prompt's glyphs and LazyVim's icons. WezTerm bundles a
        # symbols fallback of its own (DD-012), so this is for every OTHER consumer —
        # fontconfig resolves the glyphs from here for Konsole, DMS, and anything else.
        - cascadia-mono-nf-fonts
    remove:
      packages:
        # Aurora layers Firefox as an RPM. It goes, for two reasons: a layered browser can
        # only be updated by rebasing the whole image, and the browser here is Ungoogled
        # Chromium (the Flatpak below), so leaving Firefox installed would leave a second
        # browser competing to be the default. DD-006, DD-023.
        - firefox
        - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)

  # 3. Flatpak remotes and seeded applications.
  #    These are NOT baked into the image: a systemd unit installs them on first boot,
  #    so the first boot needs network access.
  #    Ordering: after the `dnf` removal above.
  - type: default-flatpaks
    configurations:
      # System scope — present for every user on the machine.
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          # The default browser, replacing the removed Firefox RPM. A Flatpak, so its
          # security updates come from Flathub instead of waiting for an image rebuild.
          # Being installed is not the same as being the default: the handler wiring is
          # in files/system/etc/xdg/mimeapps.list and .../kdeglobals. DD-023.
          - io.github.ungoogled_software.ungoogled_chromium
          - org.gnome.Loupe # image viewer
      # User scope — adds the Flathub user remote only, so per-user installs work
      # out of the box without any packages being forced on anyone.
      - scope: user # Also add Flathub user repo, but no user packages

  # 4. Build steps no BlueBuild module covers: things that are not an RPM and not a file
  #    that can simply be copied. Thirteen snippets, each its own layer.
  #
  #    4a. zsh-completions: completion functions for tools zsh does not cover itself.
  #    A raw build step because there is nothing to install FROM: Fedora does not package
  #    zsh-completions, and the @zsh-users/zsh-completions COPR has no chroots at all —
  #    not for the current Fedora, not for any. Verified against the COPR API, not assumed.
  #
  #    So: a pinned upstream tag, and the clone is only trusted after `rev-parse` matches
  #    the commit that tag pointed at when this was written. A tag can be moved; a commit
  #    hash cannot. If upstream ever re-points 0.36.0, the build FAILS here rather than
  #    silently shipping something else — which is the intended behaviour.
  #
  #    /usr/share/zsh/site-functions is already on zsh's default $fpath, so nothing in the
  #    shell configuration has to add it. `git` is installed by the module above rather
  #    than assumed present on Aurora DX.
  #
  #    To bump: change BOTH the tag and the hash, from
  #    https://github.com/zsh-users/zsh-completions/releases.
  #
  #    Ordering: after `dnf`, which installs zsh and git. DD-026.
  - type: containerfile
    snippets:
      - |
        RUN set -eu; \
            tmp="$(mktemp -d)"; \
            git clone --quiet --depth 1 --branch 0.36.0 \
                https://github.com/zsh-users/zsh-completions.git "$tmp"; \
            test "$(git -C "$tmp" rev-parse HEAD)" = "28c5bdcaf81bb89e56d0df8267d822c3b8aed9e0"; \
            install -d -m 0755 /usr/share/zsh/site-functions; \
            install -m 0644 "$tmp"/src/_* /usr/share/zsh/site-functions/; \
            rm -rf "$tmp"; \
            ls /usr/share/zsh/site-functions | wc -l

      #    4b. Assert the two things the login-shell service depends on.
      #
      #        `usermod` is what qubix-default-shell.service runs to move an existing
      #        account to zsh. It comes from shadow-utils, which Aurora keeps — unlike
      #        `chsh`, which Aurora DELETES from the image
      #        (ublue-os/aurora, build_files/base/16-override-install.sh: "Footgun").
      #        That deletion is the whole reason the service exists, so checking that its
      #        replacement is present is not ceremony. DD-035.
      #
      #        /usr/bin/zsh in /etc/shells is NOT needed by usermod, which never consults
      #        it. It is asserted for everything else that does: a `chsh` the user layers
      #        back on, and anything that declines to treat an account as interactive when
      #        its shell is unlisted. The entry comes from zsh's %post in the BASE image —
      #        Aurora installs zsh itself, so the package is already there when the module
      #        above lists it — not from a scriptlet in this build. DD-028, DD-035.
      - |
        RUN set -eu; \
            command -v usermod >/dev/null; \
            grep -qx '/usr/bin/zsh' /etc/shells

      #    4c. zellij — the terminal multiplexer.
      #
      #        NOT A PACKAGE, AND NOT A COPR. Fedora does not package zellij (no `zellij`
      #        and no `rust-zellij` in dist-git), and — unlike yazi — zellij's own docs
      #        give Fedora users no instructions and endorse no COPR. The COPRs that do
      #        exist are one-person repos with a handful of builds; enabling one adds a
      #        party who can run scriptlets in EVERY Qubix image, for one tool.
      #        So this takes upstream's own release artifact, pinned and hash-asserted,
      #        exactly as 4a does for zsh-completions. DD-033.
      #
      #        THE `no-web` BUILD, on purpose: zellij 0.43 added a local web server, off
      #        by default but present. Upstream also publishes a build compiled without
      #        the capability, which makes it unavailable rather than merely disabled.
      #
      #        The published .sha256sum is the hash of the BINARY INSIDE the tarball, not
      #        of the tarball, so the assertion is on the artifact that actually ships.
      #
      #        HOME is redirected into the temp dir for every zellij invocation: zellij
      #        creates its cache directory on startup, and the build container's /root
      #        must not end up in the image.
      #
      #        The last two lines are the real assertion. `zellij setup --check` reports
      #        which config file it resolves and whether it parses, and it does NOT exit
      #        non-zero when the config is broken — hence grep. This proves both that
      #        /etc/zellij (the overlay from module 1) is the directory zellij will use,
      #        and that the KDL shipped there is valid, at build time instead of at a
      #        user's first login.
      #
      #        To bump: change BOTH the version and the hash, from
      #        https://github.com/zellij-org/zellij/releases — the hash is in
      #        zellij-no-web-x86_64-unknown-linux-musl.sha256sum.
      #
      #        Ordering: after module 1 (`files`), which ships /etc/zellij/config.kdl.
      - |
        RUN set -eu; \
            ver=0.44.3; \
            sha=a675b0106263113b9cb8f028649bad05c5d2283331fa62b2b36dd275aeaaa4d3; \
            tmp="$(mktemp -d)"; \
            curl -fsSL -o "$tmp/zellij.tar.gz" \
                "https://github.com/zellij-org/zellij/releases/download/v${ver}/zellij-no-web-x86_64-unknown-linux-musl.tar.gz"; \
            tar -xzf "$tmp/zellij.tar.gz" -C "$tmp"; \
            echo "${sha}  ${tmp}/zellij" | sha256sum -c -; \
            install -D -m 0755 "$tmp/zellij" /usr/bin/zellij; \
            HOME="$tmp" zellij --version | grep -qx "zellij ${ver}"; \
            install -d -m 0755 /usr/share/zsh/site-functions /usr/share/bash-completion/completions; \
            HOME="$tmp" zellij setup --generate-completion zsh > /usr/share/zsh/site-functions/_zellij; \
            HOME="$tmp" zellij setup --generate-completion bash > /usr/share/bash-completion/completions/zellij; \
            HOME="$tmp" zellij setup --check > "$tmp/check" 2>&1; \
            grep -qF '[LOOKING FOR CONFIG FILE FROM]: "/etc/zellij/config.kdl"' "$tmp/check"; \
            grep -qF '[CONFIG FILE]: Well defined.' "$tmp/check"; \
            rm -rf "$tmp"

      #    4d. The two fonts WezTerm's config names that no repository packages.
      #
      #        Monaspace Krypton NF is the primary face in /etc/xdg/wezterm/wezterm.lua and
      #        IBM Plex Math is the fallback right behind it. Fedora packages neither —
      #        there is no monaspace-fonts at all, and ibm-plex-fonts 6.4.0 has no `math`
      #        subpackage (its co-packages are mono, sans, serif, arabic, devanagari,
      #        hebrew and the two thai). So both come from upstream's own release, pinned by
      #        version and asserted by SHA-256, exactly as 4a and 4c do. DD-034.
      #
      #        THE NERD FONT BUILD, on purpose. WezTerm bundles Symbols Nerd Font Mono as a
      #        built-in fallback (DD-012), so the plain build would have rendered the same
      #        glyphs — but "Monaspace Krypton NF" is the family name the user's own config
      #        asks for on every other machine, and only the NF build answers to it.
      #
      #        ONLY THE NORMAL-WIDTH FACES. The archive carries each weight three times
      #        over, at Normal, SemiWide and Wide; `-x '*Wide*'` drops the latter two, which
      #        a terminal never asks for and which only give font matching a chance to pick
      #        the wrong one. 14 faces remain, and the count is asserted so a reorganised
      #        archive fails here rather than shipping a partial family.
      #
      #        The download is 315 MB and the temp dir is removed in the same layer, so what
      #        lands in the image is 31 MB of OTF. Monaspace's archive contains no licence
      #        file — the OFL text is vendored in the overlay at
      #        /usr/share/licenses/monaspace-krypton-nf/LICENSE — whereas IBM's ships one
      #        beside the font, so that copy is installed from the archive.
      #
      #        To bump: change BOTH the version and the hash, from
      #        https://github.com/githubnext/monaspace/releases and
      #        https://github.com/IBM/plex/releases. Then re-check the OFL text in the
      #        overlay against the new tag.
      #
      #        Ordering: after `dnf`, which installs `unzip`. `fc-cache` comes from
      #        fontconfig, which every graphical base already has.
      - |
        RUN set -eu; \
            mono_ver=1.400; \
            mono_sha=9b7f9505d977601d8819dfdb57fa4b49bdab61132b6d1131c2e8d092066edc5a; \
            plex_ver=1.1.0; \
            plex_sha=d85ed404394ced3a79a519af24611acdee9cc0483363c07cd5ac0656c06db42a; \
            tmp="$(mktemp -d)"; \
            curl -fsSL -o "$tmp/monaspace.zip" \
                "https://github.com/githubnext/monaspace/releases/download/v${mono_ver}/monaspace-nerdfonts-v${mono_ver}.zip"; \
            echo "${mono_sha}  ${tmp}/monaspace.zip" | sha256sum -c -; \
            install -d -m 0755 /usr/share/fonts/monaspace-krypton-nf; \
            unzip -q -j "$tmp/monaspace.zip" 'NerdFonts/Monaspace Krypton/*.otf' \
                -x '*Wide*' -d /usr/share/fonts/monaspace-krypton-nf; \
            chmod 0644 /usr/share/fonts/monaspace-krypton-nf/*.otf; \
            test "$(ls /usr/share/fonts/monaspace-krypton-nf/*.otf | wc -l)" -eq 14; \
            curl -fsSL -o "$tmp/plex-math.zip" \
                "https://github.com/IBM/plex/releases/download/%40ibm%2Fplex-math%40${plex_ver}/ibm-plex-math.zip"; \
            echo "${plex_sha}  ${tmp}/plex-math.zip" | sha256sum -c -; \
            unzip -q -j "$tmp/plex-math.zip" 'ibm-plex-math/fonts/complete/otf/*' -d "$tmp/plex"; \
            install -D -m 0644 "$tmp/plex/IBMPlexMath-Regular.otf" \
                /usr/share/fonts/ibm-plex-math/IBMPlexMath-Regular.otf; \
            install -D -m 0644 "$tmp/plex/license.txt" \
                /usr/share/licenses/ibm-plex-math/LICENSE.txt; \
            rm -rf "$tmp"; \
            fc-cache -f /usr/share/fonts/monaspace-krypton-nf /usr/share/fonts/ibm-plex-math

      #    4e. Assert that WezTerm resolves its system config AND every font it names.
      #
      #        `wezterm ls-fonts` prints the family it picked for each entry of the fallback
      #        chain, with the file it came from. It EXITS 0 REGARDLESS — a Lua syntax
      #        error, an unknown colour scheme and a missing font are all logged and then
      #        shrugged off, exactly like `zellij setup --check` in 4c. So the greps are the
      #        assertion, not the exit status.
      #
      #        HOME points at an empty temp dir and XDG_CONFIG_DIRS at /etc/xdg, which is
      #        what makes this a test of RESOLUTION and not just of the file: with no
      #        ~/.wezterm.lua and no ~/.config/wezterm, the only way "Monaspace Krypton NF"
      #        can be the primary font is if /etc/xdg/wezterm/wezterm.lua was found, parsed,
      #        and its fonts located. A family that fails to load is dropped from the list,
      #        so its grep fails.
      #
      #        The last grep catches the colour scheme, the one failure the font loop cannot
      #        see: WezTerm logs `color_scheme="…" but that scheme was not found` and then
      #        carries on with its default, so a renamed colors/*.toml would ship silently.
      #        It matches that message and not a bare "ERROR", which a container with no
      #        session bus has other reasons to print.
      #
      #        Ordering: after `files` (ships the config), after `dnf` (installs wezterm and
      #        the packaged fonts), and after 4d (installs the other two).
      - |
        RUN set -eu; \
            tmp="$(mktemp -d)"; \
            HOME="$tmp" XDG_CONFIG_DIRS=/etc/xdg wezterm ls-fonts > "$tmp/fonts" 2>&1; \
            for family in 'Monaspace Krypton NF' 'IBM Plex Math' 'IBM Plex Mono' \
                          'IBM Plex Sans' 'Noto Sans CJK SC' 'Noto Sans CJK TC' \
                          'Noto Sans CJK JP'; do \
                grep -qF "\"$family\"" "$tmp/fonts" \
                    || { echo "wezterm did not resolve font: $family"; exit 1; }; \
            done; \
            if grep -q 'scheme was not found' "$tmp/fonts"; then \
                echo "wezterm did not find the colour scheme the config names"; exit 1; \
            fi; \
            rm -rf "$tmp"

      #    4f. Wire zsh into the shell environment, from the END of /etc/zshrc.
      #
      #        WHY NOT /etc/profile.d, where the bash half lives: Fedora's /etc/zshrc
      #        sources those files from inside a function that has run `emulate -L ksh`,
      #        so KSH_ARRAYS and SH_WORD_SPLIT are in force there — not the language zsh
      #        plugin scripts are written in. That constraint is real and unchanged.
      #
      #        WHY NOT /etc/zshenv, which is where this used to live: it is the FIRST file
      #        zsh reads, and /etc/profile.d is reached later — through /etc/zprofile for a
      #        login shell, through /etc/zshrc for an interactive one. So every variable
      #        the image exports for these tools (STARSHIP_CONFIG, ATUIN_*, LG_CONFIG_FILE,
      #        EDITOR) was being set AFTER `starship init` and `atuin init` had run. It
      #        works only because both re-read their environment at prompt time. It is also
      #        read by every zsh, scripts included, which is why it needed a guard to hold
      #        interactive setup at all. DD-036 supersedes that choice.
      #
      #        The end of /etc/zshrc is after the /etc/profile.d loop AND after Fedora's
      #        default PROMPT line, and /etc/zshrc is read only by interactive shells. The
      #        user's own ~/.zshrc still runs after it and still wins.
      #
      #        APPENDED, NOT SHIPPED. Fedora's /etc/zshrc carries real behaviour — that
      #        profile.d loop — and vendoring its 50 lines into the overlay to add six of
      #        ours would mean owning their copy forever. Appending leaves upstream's
      #        content untouched and flowing through.
      #
      #        The two greps are what make that safe: the first fails the build if the base
      #        image ever ships an /etc/zshrc that is not Fedora's, the second refuses to
      #        append twice. `zsh -n` then parses the result, so a broken shell fails here
      #        rather than at a login.
      #
      #        BOTH ARE WRITTEN AS `if`, NOT AS `! grep`. `set -e` is specified to ignore a
      #        command whose status is inverted with `!`, so `! grep -q x file` does NOT
      #        fail a build when the pattern IS found — it is an assertion that cannot
      #        assert. Verified by running this snippet twice against Fedora's file.
      #
      #        Ordering: after `files` (ships usr/share/qubix-os/shell/qubix.zsh) and after
      #        `dnf` (zsh must exist to parse-check with).
      - |
        RUN set -eu; \
            if ! grep -q '_src_etc_profile_d' /etc/zshrc; then \
                echo "/etc/zshrc is not the file Fedora ships: refusing to append"; \
                exit 1; \
            fi; \
            if grep -q 'qubix-os/shell/qubix.zsh' /etc/zshrc; then \
                echo "/etc/zshrc already carries the Qubix block"; \
                exit 1; \
            fi; \
            printf '%s\n' \
                '' \
                '# ── Qubix OS ──────────────────────────────────────────────────────────────────' \
                '# Appended at image build time by recipes/common-base.yml. Everything that zsh' \
                '# gets interactively is in the file below; a rebase changes it with nothing to' \
                '# re-run and nothing left behind in a home directory.' \
                '#' \
                '# LAST IN THIS FILE ON PURPOSE: after the /etc/profile.d loop above, so the' \
                '# variables those files export (STARSHIP_CONFIG, ATUIN_*, LG_CONFIG_FILE,' \
                '# EDITOR) are set before the tools that read them are initialised, and after' \
                '# the default PROMPT line above, so the prompt starship installs is the one' \
                '# that survives. Your own ~/.zshrc runs after this and still wins.' \
                '#' \
                '# See docs/shell.md and docs/design-decisions.md DD-036.' \
                'if [[ -r /usr/share/qubix-os/shell/qubix.zsh ]]; then' \
                '    source /usr/share/qubix-os/shell/qubix.zsh' \
                'fi' \
                >> /etc/zshrc; \
            zsh -n /etc/zshrc

      #    4g. Assert that `qubix-config` still names files that exist.
      #
      #        /usr/bin/qubix-config is the documented route from the image's configuration
      #        into a user's ~/.config (DD-039). It hardcodes six source paths — one per
      #        tool — and a path that moves would otherwise turn into "not in this image"
      #        at somebody's terminal rather than here.
      #
      #        `--check` writes nothing, needs no home directory and reports both things
      #        that can rot: a source that is gone, and niri's RELATIVE theme include, which
      #        the command rewrites to an absolute path when it copies. If that include is
      #        ever renamed upstream in files/system/etc/niri/config.kdl, a copied niri
      #        config would not load — so the build fails instead.
      #
      #        `bash -n` first, because a syntax error would make --check exit non-zero for
      #        the wrong reason and hide which one it was.
      #
      #        Ordering: after `files`, which ships both the script and every path it names.
      - |
        RUN set -eu; \
            bash -n /usr/bin/qubix-config; \
            test -x /usr/bin/qubix-config; \
            qubix-config --check

      #    4h. Assert that `fastfetch` reaches fastfetch.
      #
      #        Aurora's /etc/profile.d/ublue-fastfetch.sh aliases `fastfetch` to
      #        `ublue-fastfetch`, which runs it against Universal Blue's own config. An
      #        alias is resolved before $PATH and long before any config directory is
      #        consulted, so it beat this image's /etc/fastfetch/config.jsonc AND a user's
      #        own — the config shipped by DD-031 could not be read by the command it was
      #        for. files/system/etc/profile.d/zz-qubix-fastfetch.sh undoes that one alias.
      #
      #        THIS ASSERTS THE RESULT, NOT THE ORDERING, on purpose. The fix depends on
      #        /etc/profile.d being sourced alphabetically and on `zz-` sorting last, which
      #        is a fragile thing to depend on and an invisible thing to break — a vendor
      #        file named `zzz-*.sh` would silently restore the alias. Sourcing every file
      #        in the directory the way a shell does and then asking whether the alias
      #        survived tests the thing that actually matters.
      #
      #        Errors from the other files are discarded: several expect an interactive
      #        shell or a real session, and none of that is this check's business.
      #
      #        Ordering: after `files`, which ships the undo, and after `dnf`.
      - |
        RUN set -eu; \
            a="$(bash -c 'for f in /etc/profile.d/*.sh; do . "$f" >/dev/null 2>&1 || true; done; alias fastfetch 2>/dev/null')" || true; \
            if [ -n "$a" ]; then \
                echo "fastfetch is still aliased after every /etc/profile.d file: $a"; \
                echo "the image config at /etc/fastfetch/config.jsonc would never be read"; \
                exit 1; \
            fi

      #    4i. Assert that the distrobox hook can be reached, and is what it claims.
      #
      #        /etc/distrobox/distrobox.conf points distrobox at
      #        /run/host/usr/bin/qubix-distrobox-shell, which runs inside every container it
      #        creates and gives that container the same prompt, history and plugins as the
      #        host (DD-043). Three things have to hold for that to be more than a file.
      #
      #        DISTROBOX MUST BE HERE. It comes from the base image — ublue-os/main's
      #        packages.json installs it in every Universal Blue image — so this is not
      #        installed by the module above and would silently become dead weight if
      #        upstream dropped it.
      #
      #        DISTROBOX MUST STILL READ THIS FILE. The config hierarchy is a list inside
      #        distrobox-create, not an interface anyone promised: the 2.0 rewrite replaces
      #        these shell scripts with a Go binary. Grepping for the path is what turns
      #        "the hook stopped running" into a build failure that says to go and re-check
      #        it, rather than a container that quietly comes up bare.
      #
      #        THE CONFIG AND THE SCRIPT MUST AGREE. The hook is read out of the file the
      #        way distrobox reads it — by sourcing it — and the /run/host prefix is stripped
      #        to check the script exists at that path in THIS image, which is where the
      #        container will find it.
      #
      #        THE SCRIPT IS PARSED AND NEVER RUN. It exists to modify the container it runs
      #        in, and a build IS a container: it would append its block to this image's
      #        /etc/zshrc, on top of the one module 4f just added. `sh -n` is as far as a
      #        build can go, which is why the rest of its guarantees — never exiting
      #        non-zero, never printing a line starting with `Error:` (DD-045) — are stated
      #        in its header and checked by reading rather than by running.
      #
      #        BOTH BLOCK MARKERS MUST SURVIVE AN EDIT. The script writes its block into the
      #        container's zshrc between them and deletes that range on the next run, which
      #        is the only way a fix reaches a container that already exists (DD-046). Lose
      #        the end marker and a re-run appends a second block instead of replacing the
      #        first — in a file no build can look at. Grepping for the two literals is the
      #        only part of that a build can check.
      #
      #        Ordering: after `files`, which ships both the config and the script.
      - |
        RUN set -eu; \
            if ! command -v distrobox >/dev/null; then \
                echo "distrobox is not in this image: /etc/distrobox/distrobox.conf is dead weight"; \
                exit 1; \
            fi; \
            if ! grep -q '/etc/distrobox/distrobox.conf' /usr/bin/distrobox-create; then \
                echo "distrobox-create no longer names /etc/distrobox/distrobox.conf"; \
                echo "re-check its configuration search path before trusting the hook"; \
                exit 1; \
            fi; \
            sh -n /usr/bin/qubix-distrobox-shell; \
            test -x /usr/bin/qubix-distrobox-shell; \
            for marker in "# ── Qubix OS ──" "# ── end of the Qubix OS block ──"; do \
                if ! grep -qF -- "$marker" /usr/bin/qubix-distrobox-shell; then \
                    echo "qubix-distrobox-shell no longer writes the marker: $marker"; \
                    echo "without both, a re-run appends a second block instead of replacing the first"; \
                    exit 1; \
                fi; \
            done; \
            hook="$(sh -c '. /etc/distrobox/distrobox.conf; printf %s "${container_init_hook:-}"')"; \
            if [ "$hook" != "/run/host/usr/bin/qubix-distrobox-shell" ]; then \
                echo "distrobox.conf does not name the guest setup script: ${hook:-<unset>}"; \
                exit 1; \
            fi; \
            test -x "${hook#/run/host}"

      #    4j. Build and validate the GRUB theme payload.
      #
      #        GRUB cannot consume the OTF Monaspace Krypton Nerd Font used by WezTerm. Its
      #        gfxmenu engine needs PF2 bitmap fonts, generated here with Fedora's
      #        grub2-mkfont. Only Latin text, combining marks, arrows, and box drawing are
      #        retained; Nerd Font private-use icons are irrelevant to the boot menu and
      #        would bloat every content-addressed copy retained in /boot. The PF2 files
      #        live beside the immutable source artwork until the runtime installer copies
      #        the complete directory to /boot.
      #
      #        The manifest is generated LAST and excludes itself. It gives the installer
      #        both integrity checking and a content-derived destination, so an image
      #        update never overwrites assets GRUB may be reading. Shell syntax, executable
      #        mode, component presence, reverse canvas ordering, marker pairing, exact
      #        approved labels, and every theme asset are asserted before the image can
      #        publish. DD-057.
      #
      #        Ordering: after `files` (theme, installer, unit), `dnf` (grub2-mkfont from
      #        grub2-tools-extra), and module 4d (the pinned Krypton NF OTF faces).
      - |
        RUN set -eu; \
            theme=/usr/share/qubix-os/grub-theme; \
            krypton=/usr/share/fonts/monaspace-krypton-nf; \
            regular="$krypton/MonaspaceKryptonNF-Regular.otf"; \
            bold="$krypton/MonaspaceKryptonNF-Bold.otf"; \
            glyphs=0x20-0x24f,0x300-0x36f,0x2190-0x21ff,0x2500-0x257f; \
            test -s "$regular"; \
            test -s "$bold"; \
            grub2-mkfont --name='Monaspace Krypton NF' --range="$glyphs" --size=16 \
                --output="$theme/qubix-krypton-16.pf2" "$regular"; \
            grub2-mkfont --name='Monaspace Krypton NF' --range="$glyphs" --size=20 \
                --output="$theme/qubix-krypton-20.pf2" "$regular"; \
            grub2-mkfont --name='Monaspace Krypton NF' --range="$glyphs" --size=20 \
                --output="$theme/qubix-krypton-bold-20.pf2" "$bold"; \
            strings "$theme/qubix-krypton-16.pf2" \
                | grep -qF 'Monaspace Krypton NF Regular 16'; \
            strings "$theme/qubix-krypton-20.pf2" \
                | grep -qF 'Monaspace Krypton NF Regular 20'; \
            strings "$theme/qubix-krypton-bold-20.pf2" \
                | grep -qF 'Monaspace Krypton NF Bold 20'; \
            bash -n /usr/bin/qubix-grub-theme; \
            test -x /usr/bin/qubix-grub-theme; \
            grep -qxF '2' "$theme/VERSION"; \
            grep -qxF '+ boot_menu {' "$theme/theme.txt"; \
            test "$(grep -cF 'id = "__timeout__"' "$theme/theme.txt")" -eq 1; \
            if grep -qF '+ progress_bar {' "$theme/theme.txt"; then \
                echo 'GRUB theme must use only the numeric timeout label'; \
                exit 1; \
            fi; \
            grep -qF 'QUBIX OS // BOOT CONSOLE' "$theme/theme.txt"; \
            grep -qF '[UP/DOWN] Navigate   [ENTER] Boot   [E] Edit   [C] Console' \
                "$theme/theme.txt"; \
            for font in 'Monaspace Krypton NF Regular 16' \
                        'Monaspace Krypton NF Regular 20' \
                        'Monaspace Krypton NF Bold 20'; do \
                grep -qF "\"$font\"" "$theme/theme.txt" \
                    || { echo "GRUB theme does not name generated font: $font"; exit 1; }; \
            done; \
            test "$(grep -cF 'file = "panel.png"' "$theme/theme.txt")" -eq 1; \
            awk '/^\+ / { last_start=NR } /file = "panel.png"/ { panel=NR } \
                 END { exit !(panel > last_start) }' "$theme/theme.txt"; \
            grep -qF 'set timeout_style=menu' /usr/bin/qubix-grub-theme; \
            grep -qF 'set timeout=8' /usr/bin/qubix-grub-theme; \
            test "$(grep -cF '# >>> Qubix OS GRUB theme >>>' /usr/bin/qubix-grub-theme)" -eq 1; \
            test "$(grep -cF '# <<< Qubix OS GRUB theme <<<' /usr/bin/qubix-grub-theme)" -eq 1; \
            for asset in VERSION theme.txt background.png panel.png line.png selected_c.png \
                         qubix-krypton-16.pf2 qubix-krypton-20.pf2 \
                         qubix-krypton-bold-20.pf2; do \
                test -s "$theme/$asset"; \
            done; \
            (cd "$theme"; \
             LC_ALL=C find . -maxdepth 1 -type f ! -name MANIFEST.sha256 -printf '%P\n' \
                 | LC_ALL=C sort | xargs sha256sum > MANIFEST.sha256; \
             sha256sum --check --status MANIFEST.sha256)

      #    4k. Validate Homebrew desktop application discovery and refresh wiring.
      #
      #        A working `brew` in a terminal does not prove that a graphical launcher can
      #        see its desktop metadata. Assert both environment entry points, executable
      #        helper modes/syntax, watched desktop/icon directories, service target, and
      #        recipe-enabled path unit before publishing the image. DD-062.
      #
      #        Ordering: after `files`, which ships every asserted path.
      - |
        RUN set -eu; \
            helper=/usr/bin/qubix-refresh-app-launchers; \
            icon_helper=/usr/bin/qubix-stabilize-homebrew-icons; \
            path_unit=/usr/lib/systemd/user/qubix-app-launcher-refresh.path; \
            service_unit=/usr/lib/systemd/user/qubix-app-launcher-refresh.service; \
            bash -n "$helper"; \
            bash -n "$icon_helper"; \
            sh -n /etc/profile.d/qubix-shell-env.sh; \
            test -x "$helper"; \
            test -x "$icon_helper"; \
            grep -qF 'XDG_DATA_DIRS=/home/linuxbrew/.linuxbrew/share:' \
                /usr/lib/environment.d/50-qubix-terminal.conf; \
            grep -qxF 'PathModified=%h/.local/share/applications' "$path_unit"; \
            grep -qxF 'PathModified=/home/linuxbrew/.linuxbrew/share/applications' \
                "$path_unit"; \
            grep -qxF 'PathModified=%h/.local/share/icons' "$path_unit"; \
            grep -qxF 'PathModified=/home/linuxbrew/.linuxbrew/share/icons' "$path_unit"; \
            grep -qxF 'Unit=qubix-app-launcher-refresh.service' "$path_unit"; \
            grep -qxF 'ExecStart=/usr/bin/qubix-refresh-app-launchers' "$service_unit"; \
            grep -qF 'qubix-stabilize-homebrew-icons' "$helper"; \
            grep -qF 'systemctl --user try-restart dms.service' "$helper"

      #    4l. Validate the complete KDE appearance fallback for fresh accounts.
      #
      #        A rebase from Aurora can carry a populated ~/.config/kdeglobals, masking a
      #        missing system default. An ISO-created account has no such file. Resolve the
      #        shipped cascade with an empty HOME, assert every Breeze Dark component it
      #        names, then add a user file and prove that the user still wins. Selecting
      #        KDE's Qt platform integration in Niri and the shell fallback makes the same
      #        cascade apply outside Plasma without leaking the setting into DMS. Plasma's
      #        session command is also narrowed before startup so Fcitx gets one native
      #        Wayland route per toolkit. DD-063, DD-066, DD-067.
      #
      #        Ordering: after `files` and `dnf`; the former ships the fragments and the
      #        latter/base image supplies every asserted Breeze and integration asset.
      - |
        RUN set -eu; \
            command -v kreadconfig6 >/dev/null; \
            test -f /usr/share/color-schemes/BreezeDark.colors; \
            test -d /usr/share/icons/breeze-dark; \
            test -d /usr/share/plasma/look-and-feel/org.kde.breezedark.desktop; \
            test -f /usr/lib64/qt6/plugins/platformthemes/KDEPlasmaPlatformTheme6.so; \
            tmp="$(mktemp -d)"; \
            HOME="$tmp" XDG_CONFIG_DIRS=/etc/xdg \
                kreadconfig6 --file kdeglobals --group General --key ColorScheme \
                | grep -qxF BreezeDark; \
            HOME="$tmp" XDG_CONFIG_DIRS=/etc/xdg \
                kreadconfig6 --file kdeglobals --group KDE --key LookAndFeelPackage \
                | grep -qxF org.kde.breezedark.desktop; \
            HOME="$tmp" XDG_CONFIG_DIRS=/etc/xdg \
                kreadconfig6 --file kdeglobals --group KDE --key widgetStyle \
                | grep -qxF Breeze; \
            HOME="$tmp" XDG_CONFIG_DIRS=/etc/xdg \
                kreadconfig6 --file kdeglobals --group Icons --key Theme \
                | grep -qxF breeze-dark; \
            grep -qxF 'name=breeze-dark' /etc/xdg/plasmarc; \
            grep -qxF 'library=org.kde.breeze' /etc/xdg/kwinrc; \
            grep -qxF 'theme=Breeze' /etc/xdg/kwinrc; \
            if grep -q '^QT_QPA_PLATFORMTHEME=' \
                /usr/lib/environment.d/50-qubix-terminal.conf; then \
                echo 'Plasma platform theme leaked into every systemd user service'; \
                exit 1; \
            fi; \
            grep -qE '^[[:space:]]*QT_QPA_PLATFORMTHEME "kde"$' \
                /etc/niri/config.kdl; \
            grep -qE '^[[:space:]]*QT_QPA_PLATFORMTHEME=kde$' \
                /etc/profile.d/qubix-shell-env.sh; \
            grep -qF 'DMS_DEFAULT_LAUNCH_PREFIX' \
                /usr/share/quickshell/dms/Services/SessionService.qml; \
            grep -qxF 'UnsetEnvironment=QT_QPA_PLATFORMTHEME' \
                /usr/lib/systemd/user/dms.service.d/50-qubix-environment.conf; \
            grep -qxF \
                'Environment="DMS_DEFAULT_LAUNCH_PREFIX=env QT_QPA_PLATFORMTHEME=kde"' \
                /usr/lib/systemd/user/dms.service.d/50-qubix-environment.conf; \
            plasma_session=/usr/share/wayland-sessions/plasma.desktop; \
            test -f "$plasma_session"; \
            grep -qE '^Exec=.*startplasma-wayland' "$plasma_session"; \
            sed -i '/^Exec=.*startplasma-wayland/s|^Exec=|Exec=/usr/bin/env -u GTK_IM_MODULE -u QT_IM_MODULE -u SDL_IM_MODULE |' \
                "$plasma_session"; \
            grep -qE '^Exec=/usr/bin/env -u GTK_IM_MODULE -u QT_IM_MODULE -u SDL_IM_MODULE .*startplasma-wayland' \
                "$plasma_session"; \
            fcitx_env=/etc/profile.d/zz-qubix-fcitx-wayland.sh; \
            env XDG_SESSION_TYPE=wayland XDG_CURRENT_DESKTOP=KDE \
                GTK_IM_MODULE=fcitx QT_IM_MODULE=fcitx SDL_IM_MODULE=fcitx \
                XMODIFIERS=@im=fcitx sh -c \
                '. "$1"; test -z "${GTK_IM_MODULE+x}${QT_IM_MODULE+x}${SDL_IM_MODULE+x}"; test "$XMODIFIERS" = @im=fcitx' \
                sh "$fcitx_env"; \
            env XDG_SESSION_TYPE=wayland XDG_CURRENT_DESKTOP=niri \
                GTK_IM_MODULE=fcitx QT_IM_MODULE=fcitx SDL_IM_MODULE=fcitx \
                XMODIFIERS=@im=fcitx sh -c \
                '. "$1"; test -z "${GTK_IM_MODULE+x}"; test "$QT_IM_MODULE" = fcitx; test "$SDL_IM_MODULE" = fcitx; test "$XMODIFIERS" = @im=fcitx' \
                sh "$fcitx_env"; \
            install -d -m 0700 "$tmp/.config"; \
            printf '%s\n' '[General]' 'ColorScheme=BreezeLight' '[KDE]' \
                'widgetStyle=Fusion' > "$tmp/.config/kdeglobals"; \
            HOME="$tmp" XDG_CONFIG_DIRS=/etc/xdg \
                kreadconfig6 --file kdeglobals --group General --key ColorScheme \
                | grep -qxF BreezeLight; \
            HOME="$tmp" XDG_CONFIG_DIRS=/etc/xdg \
                kreadconfig6 --file kdeglobals --group KDE --key widgetStyle \
                | grep -qxF Fusion; \
            rm -rf "$tmp"

      #    4m. Keep Plasma's launcher defaults aligned with upstream Aurora and brand them.
      #
      #        Aurora deliberately omits Discover from its default taskbar and application
      #        launcher files. Verify those defaults and reject any Discover package, desktop
      #        entry, backend, or favorite reintroduced by a base-image change. Plasma 6.7
      #        compiles the launcher applets into plugins, so there is no installed schema XML
      #        to patch; replace every packaged Breeze KDE/Plasma start-icon alias with the
      #        freedesktop distributor logo instead.
      #
      #        This must run after `dnf`, because Plasma and Breeze own the files being
      #        amended, and after `files`, which supplies the canonical Qubix SVG. The base
      #        image supplies the launcher-default files asserted below. Refuse to publish
      #        if either applet plugin disappears or any alias family has no installed files.
      #        DD-068, DD-069.
      - |
        RUN set -eu; \
            if command -v plasma-discover >/dev/null 2>&1 || \
                test -e /usr/share/applications/org.kde.discover.desktop || \
                test -e /usr/lib64/qt6/plugins/discover/flatpak-backend.so; then \
                echo 'Plasma Discover must remain absent from the image'; \
                exit 1; \
            fi; \
            for launcher_defaults in \
                /usr/share/kde-settings/kde-profile/default/xdg/kicker-extra-favoritesrc \
                /usr/share/plasma/look-and-feel/dev.getaurora.aurora.desktop/contents/layouts/org.kde.plasma.desktop-layout.js; do \
                test -f "$launcher_defaults"; \
                if grep -qF 'org.kde.discover.desktop' "$launcher_defaults"; then \
                    echo "Aurora launcher defaults must not reference Discover: $launcher_defaults"; \
                    exit 1; \
                fi; \
            done; \
            logo=/usr/share/icons/hicolor/scalable/distributor-logo.svg; \
            test -s "$logo"; \
            for applet in kickoff kicker; do \
                test -f "/usr/lib64/qt6/plugins/plasma/applets/org.kde.plasma.${applet}.so"; \
            done; \
            icons="$(mktemp)"; \
            for icon_name in start-here-kde-symbolic.svg \
                start-here-kde-plasma-symbolic.svg start-here-kde.svg \
                start-here-kde-plasma.svg; do \
                find /usr/share/icons/breeze /usr/share/icons/breeze-dark \
                    \( -type f -o -type l \) -name "$icon_name" -print >> "$icons"; \
                grep -q "/${icon_name}$" "$icons"; \
            done; \
            while IFS= read -r icon; do \
                rm -f "$icon"; \
                install -m 0644 "$logo" "$icon"; \
                cmp -s "$logo" "$icon"; \
            done < "$icons"; \
            rm -f "$icons"

      #    4n. Keep Quickshell's private Qt ABI matched to the runtime libraries.
      #
      #        Quickshell links against Qt private symbols. Its RPM dependency metadata
      #        checks the public Qt sonames, which can leave an older base-image library
      #        installed even when the COPR binary was rebuilt against a newer Qt patch
      #        release. Upgrade only the three runtime families Quickshell loads, then
      #        execute its version path so an unresolved private symbol fails this build
      #        instead of breaking DMS on a user's first Niri login. DD-070.
      #
      #        Ordering: after `dnf`, which installs DMS/Quickshell and supplies the Fedora
      #        repositories, and after the other assertions, so the package boundary is
      #        checked immediately before the image leaves this shared module.
      - |
        RUN set -eu; \
            dnf5 -y upgrade --refresh \
                qt6-qtbase qt6-qtdeclarative qt6-qtwayland; \
            /usr/bin/qs --version >/dev/null

  # 5. Enable the system services this image adds.
  #    qubix-default-shell.service sets zsh as the login shell for accounts that already
  #    exist — the only thing in the terminal environment that cannot be delivered as a
  #    file, because /etc/passwd is per machine. The command that was documented instead,
  #    `chsh`, is deleted from the image by Aurora, so there was no manual path either.
  #    qubix-grub-theme.service copies the immutable theme into machine-local /boot and
  #    activates it through GRUB's custom.cfg hook without regenerating menu entries.
  #    The user path unit watches Homebrew desktop-entry locations and refreshes the
  #    already-running Plasma/DMS application index after an install or removal.
  #    All units and scripts come from the overlay (module 1); this only enables them.
  #    DD-035, DD-057, DD-062.
  #    Ordering: after `files`, which ships the units.
  - type: systemd
    system:
      enabled:
        - qubix-default-shell.service
        - qubix-grub-theme.service
    user:
      enabled:
        - qubix-app-launcher-refresh.path

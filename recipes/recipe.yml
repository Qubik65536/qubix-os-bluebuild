---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
#
# Qubix OS — the standard image. Fedora's kernel, as shipped by Aurora DX.
#
# BlueBuild transpiles this file into a Containerfile and builds it in CI.
# Modules execute TOP TO BOTTOM; the order is load-bearing (see notes per module).
#
# This recipe is deliberately short: everything it installs is shared with the other
# variants and lives in recipes/common-*.yml (DD-016). A change that should apply to
# every Qubix OS image goes in those files, not here.
#
# Docs:  docs/recipe-reference.md   (what every key and module does)
#        docs/variants.md           (this image vs. the CachyOS-kernel one)
#        docs/architecture.md       (how this becomes a bootable OS)
#        docs/design-decisions.md   (why — referenced below as DD-###)

# ── Image identity ────────────────────────────────────────────────────────────
# Published to ghcr.io/<owner>/<name>; renaming breaks existing rebases.
name: qubix-os-bluebuild
# Included in the image's OCI metadata.
description: Customized OS Image, built with BlueBuild, based on Universal Blue Aurora.

# ── Base image (FROM) ─────────────────────────────────────────────────────────
# Aurora DX = Fedora Kinoite (KDE Plasma) + Universal Blue fixes + developer tooling,
# which is why the package list is so short. DD-002.
base-image: ghcr.io/ublue-os/aurora-dx
# A release CHANNEL, not a Fedora version. `latest` tracks the CURRENT STABLE Fedora;
# `beta` tracks the next one and gets upstream changes earlier. A major Fedora jump only
# happens when this value is deliberately changed.
# Was `beta` until a pre-release amdgpu/Mesa regression hung the login compositor on real
# hardware. DD-018 supersedes DD-002.
image-version: latest

# ── Modules (executed in order) ───────────────────────────────────────────────
modules:
  # 1–3. Overlay, packages, flatpaks — everything shared by every variant.
  - from-file: common-base.yml

  # 4. os-release rewrite: ID, NAME, PRETTY_NAME. Late, by constraint (DD-003).
  - from-file: common-identity.yml

  # 5. Client-side trust configuration.
  #    Installs the cosign public key and container policy INTO the image, so
  #    `ostree-image-signed:` rebases verify. Signing of the published image itself
  #    happens in CI with SIGNING_SECRET. Because the policy ships inside the image,
  #    a first-time install needs the two-step rebase documented in docs/usage.md. DD-008.
  #    Ordering: last, by convention.
  - type: signing # this sets up the proper policy & signing files for signed images to work fully

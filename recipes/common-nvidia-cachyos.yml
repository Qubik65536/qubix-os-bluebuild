---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
#
# Qubix OS — rebuild NVIDIA's open kernel modules for the CachyOS kernel.
#
# Included by recipe-nvidia-cachyos.yml only, immediately AFTER
# common-kernel-cachyos.yml. Aurora's inherited NVIDIA kmod is tied to Fedora's exact
# kernel and leaves with that kernel; this file rebuilds the same Negativo17 driver source
# against kernel-cachyos-devel-matched. DD-051.
#
# BlueBuild's standard akmods module deliberately rejects custom kernels, so this module
# runs akmods directly and asserts the result. Fedora 44's ostree package hook still calls
# akmodsbuild as root even though that helper now requires an unprivileged account; the
# hook is suppressed only while the source package is installed, then restored. DD-051.
# CI is the only real build verification.
#
# Docs:  docs/variants.md            (support boundary and caveats)
#        docs/design-decisions.md    (DD-051 — why this is experimental)

modules:
  # 1. Install the orchestrator first so its Fedora 44 ostree hook can be neutralised
  #    before the NVIDIA source package invokes it. Installing this package normally also
  #    creates the dedicated `akmods` build account used by the explicit build below.
  - type: dnf
    install:
      packages:
        - akmods

  # 2. Save and temporarily short-circuit Fedora's compose-only helper. Its current F44
  #    implementation launches `akmodsbuild` as root, which that same package rejects.
  #    Runtime behaviour is not changed: the pristine helper is restored after the next
  #    transaction and before the explicit build.
  - type: containerfile
    snippets:
      - |
        RUN set -eu \
            && cp -a /usr/sbin/akmods-ostree-post /usr/sbin/akmods-ostree-post.qubix-original \
            && sed -i '2i exit 0' /usr/sbin/akmods-ostree-post

  # 3. Install the akmod source from the same repository Universal Blue uses for its
  #    NVIDIA images. `nonfree: negativo17` also disables RPM Fusion's conflicting
  #    NVIDIA repository for this transaction. The module removes its temporary repo
  #    file afterwards; installed packages and the inherited userspace driver remain.
  - type: dnf
    repos:
      nonfree: negativo17
      cleanup: true
    install:
      packages:
        - akmod-nvidia

  # 4. Restore Fedora's helper and the standard sticky modes on RPM's scratch directories,
  #    which ostree container commits can leave inaccessible to the unprivileged builder.
  #    Compile for the one kernel the swap left behind, regenerate module metadata, and
  #    fail closed unless the complete NVIDIA module set and userspace utility exist. The
  #    root `akmods` orchestrator deliberately delegates compilation to its unprivileged
  #    `akmods` account, then installs the resulting kmod RPM as root.
  #    KERNEL_MODULE_TYPE=open is explicit even though Negativo17's current driver uses
  #    the open sources by default; it records the intended ABI and avoids silently
  #    drifting to the proprietary kernel module flavour.
  - type: containerfile
    snippets:
      - |
        RUN set -eu \
            && mv -f /usr/sbin/akmods-ostree-post.qubix-original /usr/sbin/akmods-ostree-post \
            && chmod 1777 /tmp /var/tmp \
            && runuser -u akmods -- test -w /tmp \
            && runuser -u akmods -- test -w /var/tmp \
            && test "$(find /usr/lib/modules -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 \
            && KVER="$(basename "$(find /usr/lib/modules -mindepth 1 -maxdepth 1 -type d)")" \
            && echo "Building NVIDIA Open modules for ${KVER}" \
            && KERNEL_MODULE_TYPE=open akmods --force --kernels "${KVER}" --kmod nvidia \
            && depmod -a "${KVER}" \
            && for MODULE in nvidia nvidia_drm nvidia_modeset nvidia_peermem nvidia_uvm; do \
                 if ! modinfo -k "${KVER}" "${MODULE}" > /dev/null; then \
                   find /var/cache/akmods/nvidia -name '*.failed.log' -exec cat {} \; || true; \
                   exit 1; \
                 fi; \
               done \
            && modinfo -k "${KVER}" -F license nvidia | grep -q 'MIT/GPL' \
            && test -x /usr/bin/nvidia-smi \
            && rpm -qf /usr/bin/nvidia-smi > /dev/null

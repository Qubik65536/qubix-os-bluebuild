---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
#
# Qubix OS — replace Fedora's kernel with CachyOS's.
#
# Included with `from-file: common-kernel-cachyos.yml` by recipes/recipe-cachyos.yml ONLY.
# The standard image must never include this file. DD-017.
#
# Ordering: after common-base.yml (so package work is done) and BEFORE
# common-identity.yml (so the os-release rewrite stays the last word on identity).
# The including recipe must also run the `initramfs` module afterwards — the initramfs
# is NOT regenerated by installing a kernel in a container build.
#
# Docs:  docs/variants.md            (what this variant is, and its caveats)
#        docs/design-decisions.md    (DD-017 — why, and why in this order)

modules:
  # 1. CachyOS's own Fedora port of their kernels.
  #    Ships kernel-cachyos (default, x86-64-v3), -lts, -rt and -server.
  #    The companion `bieszczaders/kernel-cachyos-addons` repo (cachyos-settings,
  #    scx-scheds, ananicy-cpp, uksmd) is deliberately NOT enabled — one change to
  #    evaluate at a time. Tracked as IMG-006.
  - type: dnf
    repos:
      copr:
        - bieszczaders/kernel-cachyos
    install:
      packages:
        # Secure Boot tooling, on this variant only. The CachyOS kernel carries no PE
        # signature (verified against the published RPM: its certificate table is empty,
        # and the spec has no signing step), so running with Secure Boot ON means signing
        # the kernel with a key of your own. These are the two tools that procedure needs
        # — shipping them keeps it copy-pasteable instead of starting with a package
        # layer and a reboot. docs/variants.md, DD-017.
        - sbsigntools # sbsign / sbverify
        - mokutil # enrol the key with shim

  # 2. The swap itself.
  #    Not expressible as `dnf` module install/remove fields, because the ORDER of the two
  #    operations is load-bearing: kernel-cachyos-core declares `Provides: kernel`, so
  #    removing "kernel" after the install would take the new kernel straight back out.
  #    Remove first, while the CachyOS packages do not exist yet, then install.
  #
  #    Step by step:
  #      - Record the installed package set, so module 3 can report what the removal took
  #        with it, and record the kmod-* packages specifically: any prebuilt out-of-tree
  #        module is built against one exact kernel-uname-r and cannot survive the swap.
  #      - Remove Fedora's kernel. --no-autoremove keeps unrelated leaf packages.
  #      - Delete the stock kernel's module directory: RPM leaves generated files behind
  #        (initramfs.img, modules.dep), and a bootc image with two module directories is
  #        ambiguous about which kernel it boots.
  #      - Install the CachyOS kernel with tsflags=noscripts. THIS IS REQUIRED, not a
  #        speed-up: kernel-cachyos-core's %posttrans runs kernel-install, which on a
  #        ublue base is hooked by 05-rpmostree.install → dracut, and dracut aborts with
  #        "modules.dep is missing. Did you run depmod?" because the CachyOS RPMs ship no
  #        modules.dep and nothing has run depmod yet. The scriptlet failure fails the
  #        whole build. Skipping scriptlets and doing the work here is the fix. DD-017.
  #      - kernel-cachyos-devel-matched replaces the kernel-devel-matched that came out
  #        with Fedora's kernel, so akmods still has headers to build against.
  #      - depmod, because that is the part of the skipped scriptlets that matters: the
  #        `initramfs` module's dracut run needs modules.dep to exist.
  #      - Assert exactly ONE kernel remains, with a vmlinuz and a modules.dep. If
  #        anything above only half worked, the build fails here rather than shipping an
  #        unbootable image.
  - type: containerfile
    snippets:
      - |
        RUN set -eu \
            && rpm -qa --queryformat '%{NAME}\n' | sort > /tmp/pkgs-before-swap \
            && echo "Out-of-tree kernel modules present before the swap (these cannot survive it):" \
            && { rpm -qa 'kmod-*' | sort || true; } \
            && STOCK_KVER="$(rpm -q --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' kernel-core | tail -n1)" \
            && echo "Removing Fedora kernel ${STOCK_KVER}" \
            && dnf5 -y remove --no-autoremove \
                 kernel kernel-core kernel-modules kernel-modules-core kernel-modules-extra \
            && rm -rf "/usr/lib/modules/${STOCK_KVER}" \
            && dnf5 -y install --setopt=tsflags=noscripts \
                 kernel-cachyos kernel-cachyos-core kernel-cachyos-modules \
                 kernel-cachyos-devel-matched \
            && dnf5 clean all \
            && test "$(ls -1 /usr/lib/modules | wc -l)" -eq 1 \
            && KVER="$(ls -1 /usr/lib/modules)" \
            && test -f "/usr/lib/modules/${KVER}/vmlinuz" \
            && depmod -a "${KVER}" \
            && test -f "/usr/lib/modules/${KVER}/modules.dep" \
            && echo "Kernel now: ${KVER}"

  # 3. Put back what the kernel removal took with it.
  #    Removing kernel-core removes everything that depends on it, which on Aurora DX is
  #    more than kernel modules: the libguestfs/virt-v2v stack and virtualbox-guest-additions
  #    all declare a plain `Requires: kernel`. kernel-cachyos-core PROVIDES `kernel`, so
  #    they install cleanly again now that it is in place — this variant is supposed to
  #    differ from the standard image in the kernel and nothing else (DD-017).
  #
  #    --skip-unavailable because a package can legitimately be ungettable (in the base
  #    image, virtualbox-guest-additions came from a repo that is not enabled at build
  #    time). The comm output above the install is the drift alarm: anything listed there
  #    and not named below is gone from this variant, deliberately or not.
  #
  #    kmod-* and their userspace halves are NOT restored: they are built against the
  #    exact kernel-uname-r that was just removed and would pull it back in.
  - type: containerfile
    snippets:
      - |
        RUN set -eu \
            && rpm -qa --queryformat '%{NAME}\n' | sort > /tmp/pkgs-after-swap \
            && echo "Packages the kernel removal took with it:" \
            && comm -23 /tmp/pkgs-before-swap /tmp/pkgs-after-swap \
            && dnf5 -y install --skip-unavailable \
                 libguestfs libguestfs-appliance libguestfs-xfs guestfs-tools virt-v2v \
                 virtualbox-guest-additions \
            && dnf5 clean all \
            && rm -f /tmp/pkgs-before-swap /tmp/pkgs-after-swap

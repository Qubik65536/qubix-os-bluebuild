---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
#
# Qubix OS — replace Fedora's kernel with CachyOS's.
#
# Included with `from-file: common-kernel-cachyos.yml` by recipes/recipe-cachyos.yml ONLY.
# The standard image must never include this file. DD-017.
#
# Ordering: after common-base.yml (so package work is done) and BEFORE
# common-identity.yml (so the os-release rewrite stays the last word on identity).
# The including recipe must also run the `initramfs` module afterwards — the initramfs
# is NOT regenerated by installing a kernel in a container build.
#
# Docs:  docs/variants.md            (what this variant is, and its caveats)
#        docs/design-decisions.md    (DD-017 — why, and why in this order)

modules:
  # 1. CachyOS's own Fedora port of their kernels.
  #    Ships kernel-cachyos (default, x86-64-v3), -lts, -rt and -server.
  #    The companion `bieszczaders/kernel-cachyos-addons` repo (cachyos-settings,
  #    scx-scheds, ananicy-cpp, uksmd) is deliberately NOT enabled — one change to
  #    evaluate at a time. Tracked as IMG-006.
  - type: dnf
    repos:
      copr:
        - bieszczaders/kernel-cachyos

  # 2. The swap itself.
  #    Not expressible as `dnf` module install/remove fields, because the ORDER of the two
  #    operations is load-bearing: kernel-cachyos-core declares `Provides: kernel`, so
  #    removing "kernel" after the install would take the new kernel straight back out.
  #    Remove first, while the CachyOS packages do not exist yet, then install.
  #
  #    Step by step:
  #      - Record which out-of-tree modules were present. Any kmod-* RPM depends on the
  #        exact kernel-uname-r being removed and goes with it; this line is what makes
  #        that visible in the build log instead of surprising someone after a rebase.
  #      - Remove Fedora's kernel. --no-autoremove keeps unrelated leaf packages.
  #      - Delete the stock kernel's module directory: RPM leaves generated files behind
  #        (initramfs.img, modules.dep), and a bootc image with two module directories is
  #        ambiguous about which kernel it boots.
  #      - Install the CachyOS kernel. The metapackage pulls -core and -modules; both are
  #        named anyway so the transaction is explicit.
  #      - Assert exactly ONE kernel remains, with a vmlinuz. If anything above only half
  #        worked, the build fails here rather than shipping an unbootable image.
  - type: containerfile
    snippets:
      - |
        RUN set -eu \
            && echo "Out-of-tree kernel modules present before the swap:" \
            && { rpm -qa 'kmod-*' | sort || true; } \
            && STOCK_KVER="$(rpm -q --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' kernel-core | tail -n1)" \
            && echo "Removing Fedora kernel ${STOCK_KVER}" \
            && dnf5 -y remove --no-autoremove \
                 kernel kernel-core kernel-modules kernel-modules-core kernel-modules-extra \
            && rm -rf "/usr/lib/modules/${STOCK_KVER}" \
            && dnf5 -y install kernel-cachyos kernel-cachyos-core kernel-cachyos-modules \
            && dnf5 clean all \
            && test "$(ls -1 /usr/lib/modules | wc -l)" -eq 1 \
            && test -f "/usr/lib/modules/$(ls -1 /usr/lib/modules)/vmlinuz" \
            && echo "Kernel now: $(ls -1 /usr/lib/modules)"
